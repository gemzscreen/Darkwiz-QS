<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARKWIZ QS Reports</title>
<meta name="description" content="Portfolio, rate benchmarking, billing and material spend reporting across DARKWIZ QS projects.">
<meta name="theme-color" content="#16202B">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2316202B'/%3E%3Crect x='11' y='8' width='29' height='38' rx='2.5' fill='%23F2F4F6'/%3E%3Cg fill='%230B5D6B'%3E%3Crect x='16' y='14' width='19' height='3' rx='1.5'/%3E%3Crect x='16' y='21' width='13' height='3' rx='1.5'/%3E%3Crect x='16' y='28' width='16' height='3' rx='1.5'/%3E%3C/g%3E%3Cg transform='rotate(-32 38 44)'%3E%3Crect x='19' y='37' width='40' height='14' rx='2.5' fill='%23C8940A'/%3E%3Cg stroke='%2316202B' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M26 37v5'/%3E%3Cpath d='M32 37v8'/%3E%3Cpath d='M38 37v5'/%3E%3Cpath d='M44 37v8'/%3E%3Cpath d='M50 37v5'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202B; --ink-2:#1F2C3A; --ink-3:#2C3D4F;
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --rule:#CFD7E0; --rule-soft:#E3E9EE;
  --accent:#0B5D6B; --accent-lite:#128296; --accent-wash:#E4F1F3;
  --signal:#C8940A; --signal-wash:#FBF3DE;
  --good:#166E4D; --bad:#A32117; --muted:#61728A;
  --input:#FFFDF2; --input-rule:#D9C68B;
  --calc:#F3F7F4;
  --shadow:0 1px 2px rgba(22,32,43,.08),0 8px 24px rgba(22,32,43,.06);
  --rail:248px;
  --f-disp:'Barlow Condensed',Impact,sans-serif;
  --f-body:'IBM Plex Sans',-apple-system,Segoe UI,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-body); font-size:14px; color:var(--ink);
  background:var(--paper); -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent-lite)}

/* ── layout ─────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
body.rail-off{--rail:0px}
body.rail-off .rail{display:none}
.railclose{
  border:1px solid #3C5064;background:transparent;color:#8FA3B6;width:24px;height:24px;
  border-radius:3px;cursor:pointer;line-height:1;font-size:15px;padding:0;flex:0 0 auto;
}
.railclose:hover{background:#2C3D4F;color:#fff}
.brand{display:flex;align-items:flex-start;gap:10px}
.brand .bwrap{flex:1;min-width:0}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--ink); color:#C6D2DE;
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{
  font-family:var(--f-disp); font-size:26px; font-weight:700; letter-spacing:.06em;
  color:#fff; line-height:1; text-transform:uppercase;
}
.brand .mark span{color:var(--signal)}
.brand .sub{
  font-family:var(--f-mono,var(--f-num)); font-size:9.5px; letter-spacing:.18em;
  text-transform:uppercase; color:#7C8FA3; margin-top:6px;
}
.navgrp{padding:14px 0 2px}
.navgrp h4{
  margin:0 0 6px; padding:0 18px; font-family:var(--f-num); font-size:9.5px;
  font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:#5E7186;
}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 18px;border:0;
  background:none;color:#C6D2DE;text-align:left;cursor:pointer;font-size:13.5px;
  border-left:3px solid transparent;
}
.navbtn:hover{background:rgba(255,255,255,.05);color:#fff}
.navbtn.on{background:rgba(18,130,150,.22);color:#fff;border-left-color:var(--signal);font-weight:500}
.navbtn .cd{
  font-family:var(--f-num);font-size:9.5px;color:#6C8091;min-width:30px;
}
.navbtn.on .cd{color:var(--signal)}
.railfoot{padding:14px 18px 24px;font-size:11px;color:#5E7186;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ── title block (signature) ────────────────────────── */
.titleblock{
  background:var(--surface); border-bottom:2px solid var(--ink);
  display:grid; grid-template-columns:1fr auto; align-items:stretch;
}
.tb-left{padding:12px 22px 11px;min-width:0}
.tb-crumb{
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;gap:8px;align-items:center;
}
.tb-crumb .chip{
  background:var(--ink);color:#fff;padding:2px 7px;border-radius:2px;letter-spacing:.1em;
}
.tb-title{
  font-family:var(--f-disp);font-size:30px;font-weight:600;line-height:1.02;
  letter-spacing:.005em;margin:4px 0 2px;text-transform:uppercase;
}
.tb-note{font-size:12.5px;color:var(--muted);max-width:78ch;line-height:1.45}
.tb-grid{
  display:grid;grid-template-columns:repeat(4,minmax(96px,auto));
  border-left:1px solid var(--rule);
}
.tb-cell{
  padding:8px 14px;border-left:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);
  display:flex;flex-direction:column;justify-content:center;
}
.tb-cell:nth-child(-n+4){border-bottom:1px solid var(--rule)}
.tb-cell b{
  font-family:var(--f-num);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
}
.tb-cell span{font-size:13px;font-weight:500;margin-top:2px;white-space:nowrap}

/* ── toolbar ────────────────────────────────────────── */
.toolbar{
  background:var(--ink-2);color:#D5DEE7;padding:7px 22px;display:flex;
  align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:29;
}
.tgl{display:flex;align-items:center;gap:8px}
.tgl>b{
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7E93A8;font-weight:600;
}
.seg{display:flex;border:1px solid #3C5064;border-radius:3px;overflow:hidden}
.seg button{
  border:0;background:transparent;color:#9FB2C4;padding:4px 12px;cursor:pointer;
  font-family:var(--f-num);font-size:11px;font-weight:500;letter-spacing:.05em;
}
.seg button.on{background:var(--signal);color:#1B1405;font-weight:600}
.tbar-fx{
  width:74px;background:#101922;border:1px solid #3C5064;color:#D5DEE7;
  padding:3px 7px;border-radius:3px;font-family:var(--f-num);font-size:11.5px;text-align:right;
}
.tbar-sp{flex:1}
.tbtn{
  background:transparent;border:1px solid #3C5064;color:#B9C8D6;padding:4px 11px;
  border-radius:3px;cursor:pointer;font-size:12px;
}
.tbtn:hover{background:#2C3D4F;color:#fff}
.tbtn.pri{background:var(--accent-lite);border-color:var(--accent-lite);color:#fff}
.tbtn.pri:hover{background:#0F6E7F}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn:disabled:hover{background:transparent;color:#B9C8D6}

.savestate{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#7E93A8;white-space:nowrap;
}
.savestate::before{
  content:'';width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto;
}
.savestate.dirty{color:var(--signal)}
.savestate.dirty::before{background:var(--signal)}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:120;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;
  box-shadow:0 6px 28px rgba(22,32,43,.32);opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;max-width:min(92vw,520px);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad)}

/* ── content ────────────────────────────────────────── */
.sheet{padding:22px 22px 80px;max-width:1500px}
.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden;
}
.card>header{
  padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.card>header h3{
  margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;
}
.card>header .code{
  font-family:var(--f-num);font-size:10px;background:var(--accent-wash);color:var(--accent);
  padding:2px 7px;border-radius:2px;letter-spacing:.08em;font-weight:600;
}
.card>header .sp{flex:1}
.card>header p{margin:0;font-size:12px;color:var(--muted)}
.pad{padding:16px}
.hint{
  font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 12px;
}
.note{
  background:var(--signal-wash);border-left:3px solid var(--signal);padding:9px 13px;
  font-size:12.5px;line-height:1.55;margin:0 0 14px;border-radius:0 3px 3px 0;
}
.note b{font-weight:600}

/* ── tables ─────────────────────────────────────────── */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:600;color:#405266;background:var(--surface-2);
  padding:7px 9px;text-align:left;border-bottom:2px solid var(--rule);white-space:nowrap;
}
th.n,td.n{text-align:right}
th.c,td.c{text-align:center}
td{padding:4px 9px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tbody tr:hover{background:#FAFCFD}
td.n,td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px}
tr.grp td{
  background:var(--ink-3);color:#fff;font-family:var(--f-disp);font-size:14px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:5px 9px;
}
tr.sum td{background:var(--calc);font-weight:600;border-top:1px solid var(--rule)}
tr.tot td{
  background:var(--ink);color:#fff;font-weight:600;
  font-family:var(--f-num);border-top:2px solid var(--ink);
}
tr.tot td:first-child{font-family:var(--f-disp);font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.calc{background:var(--calc);color:var(--accent);font-weight:500}

/* Money is a symbol glued to a figure. Rendered as one inline-flex unit so the
   sign can never wrap onto its own line, however narrow the column gets. */
.money{
  display:inline-flex;align-items:baseline;gap:.28em;white-space:nowrap;
  font-family:var(--f-num);font-variant-numeric:tabular-nums;
}
.money>i{font-style:normal;opacity:.62;font-size:.86em;flex:0 0 auto}
.money>b{font-weight:inherit;flex:0 0 auto}
td .money,th .money{justify-content:flex-end}
.kpi .money{display:inline-flex;font-size:inherit;letter-spacing:-.01em}
.kpi .money>i{font-size:.68em;opacity:.55}
th.n,td.n{text-align:right;white-space:nowrap}
tr.tot td .money>i,tr.tot td .money>b{opacity:1}
tr.tot td .money>i{opacity:.7}

input.cell,select.cell,textarea.cell{
  width:100%;border:1px solid transparent;background:var(--input);
  border-bottom:1px solid var(--input-rule);padding:3px 6px;border-radius:2px;
}
input.cell:focus,select.cell:focus{outline:2px solid var(--accent-lite);outline-offset:-1px;background:#fff}
input.cell.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
select.cell{background:var(--input);cursor:pointer}
.iconbtn{
  border:1px solid var(--rule);background:#fff;color:var(--muted);width:24px;height:24px;
  border-radius:3px;cursor:pointer;line-height:1;font-size:14px;padding:0;
}
.iconbtn:hover{border-color:var(--bad);color:var(--bad);background:#FDF3F2}
.btn{
  border:1px solid var(--rule);background:#fff;padding:6px 13px;border-radius:3px;
  cursor:pointer;font-size:12.5px;font-weight:500;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-lite);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule-soft);background:var(--surface-2)}

/* ── forms & KPI ────────────────────────────────────── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px 16px}
.f label{
  display:block;font-family:var(--f-num);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px;
}
.f input,.f select,.f textarea{
  width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--input);
}
.f input:focus,.f select:focus{outline:2px solid var(--accent-lite);outline-offset:-1px}
.f .ro{background:var(--calc);color:var(--accent);font-family:var(--f-num);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--rule)}
.kpi{background:#fff;padding:13px 15px}
.kpi b{
  display:block;font-family:var(--f-num);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600;
}
.kpi>span{
  display:block;font-family:var(--f-num);font-size:21px;font-weight:600;margin-top:5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.kpi small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.kpi.hi span{color:var(--accent)}
.kpi.warn span{color:var(--bad)}
.kpi.ok span{color:var(--good)}

.bar{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;background:var(--accent-lite)}
.bar i.over{background:var(--bad)}
.bar i.near{background:var(--signal)}

.pill{
  display:inline-block;font-family:var(--f-num);font-size:10px;padding:2px 7px;border-radius:10px;
  letter-spacing:.05em;font-weight:600;
}
.pill.a{background:var(--accent-wash);color:var(--accent)}
.pill.g{background:#E2F0EA;color:var(--good)}
.pill.r{background:#FBEBE9;color:var(--bad)}
.pill.y{background:var(--signal-wash);color:#7A5A05}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 11px;background:var(--surface-2);
  border-bottom:1px solid var(--rule)}
.chip-b{
  border:1px solid var(--rule);background:#fff;color:var(--ink-3);padding:3px 11px;
  border-radius:14px;cursor:pointer;font-size:12px;line-height:1.5;white-space:nowrap;
}
.chip-b:hover{border-color:var(--accent);color:var(--accent)}
.chip-b.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.chip-b .ct{opacity:.6;font-family:var(--f-num);font-size:10.5px;margin-left:5px}
.chip-b.on .ct{opacity:.8}
.chip-b.clear{border-style:dashed;color:var(--muted)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1080px){.two{grid-template-columns:1fr}}

/* ── responsive ─────────────────────────────────────── */
.railtoggle{display:none}
.railshow{display:none}
body.rail-off .railshow{display:inline-flex;align-items:center;gap:6px}
@media(max-width:900px){
  .railshow,body.rail-off .railshow{display:none}
  body.rail-off .rail{display:block}
  body.rail-off{--rail:248px}
  .railclose{display:none}
  .rail{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease}
  body.nav-open .rail{transform:none;box-shadow:0 0 0 100vmax rgba(22,32,43,.45)}
  .railtoggle{display:inline-flex;align-items:center;gap:6px}
  .titleblock{grid-template-columns:1fr}
  .tb-grid{border-left:0;border-top:1px solid var(--rule);grid-template-columns:repeat(2,1fr)}
  .tb-title{font-size:24px}
  .sheet{padding:14px 12px 70px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent-lite);outline-offset:2px}

/* ── print ──────────────────────────────────────────── */
@media print{
  .rail,.toolbar,.btnrow,.iconbtn,.noprint{display:none!important}
  body{background:#fff}
  .app{display:block}
  .sheet{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;margin-bottom:12px}
  .titleblock{position:static;border-bottom:2px solid #000}
  input.cell,select.cell{background:none;border:0;-webkit-appearance:none;appearance:none}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr.tot td{background:#222!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:12mm}
}
</style>
<style>
/* reporting-only additions */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--rule);border-radius:3px;background:#fff}
.bars{display:flex;flex-direction:column;gap:9px;padding:4px 0}
.barrow{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr auto;gap:12px;align-items:center}
.barrow .lbl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .track{height:16px;background:var(--rule-soft);border-radius:3px;overflow:hidden;position:relative}
.barrow .track i{display:block;height:100%;background:var(--accent-lite)}
.barrow .track i.b{background:var(--signal)}
.barrow .track i.c{background:var(--good)}
.barrow .val{font-family:var(--f-num);font-size:12.5px;white-space:nowrap;text-align:right}
.spread{display:flex;align-items:center;gap:8px;min-width:150px}
.spread .rail2{position:relative;flex:1;height:8px;background:var(--rule-soft);border-radius:4px}
.spread .rail2 i{position:absolute;top:0;height:100%;background:var(--accent);border-radius:4px;opacity:.35}
.spread .rail2 b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h4{font-family:var(--f-disp);font-size:20px;margin:0 0 6px;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Reports">
    <div class="brand">
      <div class="bwrap">
        <div class="mark">DARK<span>WIZ</span> QS</div>
        <div class="sub">Reporting</div>
      </div>
      <button class="railclose noprint" title="Hide the sidebar" onclick="R.rail(false)">‹</button>
    </div>
    <div id="nav"></div>
    <div class="railfoot">
      Reads the shared Google Sheet.<br>Nothing here writes back.
    </div>
  </nav>

  <div class="main">
    <header class="titleblock">
      <div class="tb-left">
        <div class="tb-crumb"><span class="chip" id="tbCode">—</span><span id="tbGroup">Reports</span></div>
        <h1 class="tb-title" id="tbTitle">—</h1>
        <p class="tb-note" id="tbNote"></p>
      </div>
      <div class="tb-grid">
        <div class="tb-cell"><b>Projects</b><span id="tbProj">—</span></div>
        <div class="tb-cell"><b>Revisions</b><span id="tbRev">—</span></div>
        <div class="tb-cell"><b>Currency</b><span id="tbCur">PHP</span></div>
        <div class="tb-cell"><b>Loaded</b><span id="tbLoad">—</span></div>
      </div>
    </header>

    <div class="toolbar noprint">
      <button class="tbtn railtoggle" onclick="document.body.classList.toggle('nav-open')">☰ Reports</button>
      <button class="tbtn railshow" id="railShow" onclick="R.rail(true)">☰ Reports</button>
      <div class="tgl"><b>Currency</b>
        <div class="seg" id="segCur">
          <button data-v="PHP">₱ PHP</button><button data-v="USD">$ USD</button>
        </div>
        <input class="tbar-fx" id="fxRate" type="number" step="0.01" value="58.5">
      </div>
      <div class="tbar-sp"></div>
      <span class="savestate" id="authState"></span>
      <button class="tbtn" id="btnAuth" onclick="R.auth()">Sign in with Google</button>
      <button class="tbtn pri" onclick="R.load()">Refresh data</button>
      <button class="tbtn" onclick="window.print()">Print / PDF</button>
      <button class="tbtn" onclick="R.csv()">Export CSV</button>
    </div>

    <main class="sheet" id="sheet"></main>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script>
/* ══════════════════════════════════════════════════════════════
   DARKWIZ QS — shared database layer
   Google Sheets as the reporting store. Sign-in is per person via
   Google Identity Services; the browser talks to the Sheets API
   directly, so there is no Apps Script deployment to keep in step.

   Everything is stored in BASE UNITS: metres and Philippine peso.
   Display conversion is the reader's job, never the store's.
   ══════════════════════════════════════════════════════════════ */

const DB = {
  VERSION: 1,

  /* Column order is the contract between the publisher and the reader.
     Append new columns at the end; never reorder or remove. */
  SCHEMA: {
    _Meta: ['Key','Value'],
    Projects: ['Ref','Rev','PublishedAt','PublishedBy','Name','Client','Location',
               'ProjectDate','Storeys','PreparedBy','CheckedBy',
               'OCMPct','ProfitPct','VATPct','ContingencyPct',
               'DirectCost','OCM','Profit','VAT','Contingency','ABC',
               'PayItems','TakeoffLines','SchemaVersion'],
    BOQ: ['Ref','Rev','PayItem','Description','Unit','Qty',
          'LabourRate','EquipmentRate','MaterialRate','DirectRate','BidRate',
          'DirectAmount','Amount','SourceSheets'],
    Takeoff: ['Ref','Rev','Sheet','Description','PayItem','Mode','Qty','Unit'],
    Materials: ['Ref','Rev','Material','Category','Unit','Qty','Rate','Amount'],
    CostControl: ['Ref','Rev','Element','Budget','Actual','OpenCommitment',
                  'Assigned','Available','PctUsed'],
    Billing: ['Ref','Rev','BillingNo','PeriodFrom','PeriodTo','ContractAmount',
              'BilledPrevious','BilledThisPeriod','BilledToDate','PctComplete',
              'RetentionPct','RetentionHeld','Recoupment','NetDue']
  },
  TABS(){ return Object.keys(DB.SCHEMA); },

  /* ── flatten a project into rows ─────────────────────────── */
  flatten(S, Calc, who){
    const m=S.meta, c=S.cfg;
    const t=Calc.totals();
    const ref=String(m.ref||'').trim()||'UNREFERENCED';
    const rev=String(m.rev??'').trim()||'0';
    const at=new Date().toISOString();
    const K=[ref,rev];
    const qto=Calc.qtoLines();

    const boq=t.rows.map(r=>[...K, r.item, r.desc, r.unit, r.qty,
      r.dc?0:0, 0, 0, r.dc, r.bid, r.direct, r.amt, [...r.src].join(', ')]);
    /* fill the labour / equipment / material split from the DUPA library */
    t.rows.forEach((r,i)=>{ const d=Calc.dupa(r.item);
      if(d){ boq[i][6]=+d.lab||0; boq[i][7]=+d.eqp||0; boq[i][8]=+d.mat||0; } });

    const cc=Calc.costControl();
    const bl=Calc.billing();

    return {
      _Meta:[['schemaVersion',DB.VERSION],['lastPublish',at],['lastPublishBy',who||'']],
      Projects:[[ ...K, at, who||'', m.name||'', m.client||'', m.loc||'',
        m.date||'', +m.storeys||1, m.prep||'', m.chk||'',
        +c.ocm||0, +c.profit||0, +c.vat||0, +c.contingency||0,
        t.direct, t.ocm, t.profit, t.vat, t.cont, t.abc,
        t.rows.length, qto.length, DB.VERSION ]],
      BOQ: boq,
      Takeoff: qto.map(l=>[...K, l.sheet, l.desc, l.item, l.mode||l.dim, l.qty,
        (Calc.dupa(l.item)||{}).unit || l.dim]),
      Materials: Calc.bom().map(x=>[...K, x.name, x.cat, x.unit, x.qty, x.rate, x.amt]),
      CostControl: cc.lines.map(x=>[...K, x.el, x.bud, x.act, x.com, x.asg, x.avl, x.pct]),
      Billing: [[ ...K, +S.bill.no||0, S.bill.from||'', S.bill.to||'',
        bl.contract, bl.prev, bl.now, bl.toDate,
        bl.contract? bl.toDate/bl.contract*100 : 0,
        bl.retPct, bl.retTo, bl.rec, bl.net ]]
    };
  }
};

/* ── Google sign-in ─────────────────────────────────────────── */
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets '+
               'https://www.googleapis.com/auth/userinfo.email';

const Google = {
  token:null, email:null, _client:null, _expires:0,

  ready(){ return !!(window.google && google.accounts && google.accounts.oauth2); },
  signedIn(){ return !!Google.token && Date.now() < Google._expires; },

  signIn(clientId){
    return new Promise((resolve,reject)=>{
      if(!Google.ready()) return reject(new Error(
        'Google sign-in did not load. Check the network, and note that sign-in only works on the hosted site, not on a file opened from disk.'));
      if(!clientId) return reject(new Error('No OAuth client ID has been set.'));
      try{
        Google._client = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: SCOPES,
          callback: async (resp)=>{
            if(resp.error) return reject(new Error(resp.error_description||resp.error));
            Google.token=resp.access_token;
            Google._expires=Date.now()+((+resp.expires_in||3600)-90)*1000;
            try{
              const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',
                {headers:{Authorization:'Bearer '+Google.token}});
              Google.email=r.ok ? (await r.json()).email : null;
            }catch(e){ Google.email=null; }
            resolve(Google.email);
          },
          error_callback: e=>reject(new Error(e.type==='popup_closed'
            ? 'The sign-in window was closed.' : (e.message||'sign-in failed')))
        });
        Google._client.requestAccessToken({prompt: Google.token?'':'consent'});
      }catch(e){ reject(e); }
    });
  },
  signOut(){
    if(Google.token && Google.ready()) try{ google.accounts.oauth2.revoke(Google.token); }catch(e){}
    Google.token=null; Google.email=null; Google._expires=0;
  }
};

/* ── Sheets API ─────────────────────────────────────────────── */
const Sheets = {
  base:'https://sheets.googleapis.com/v4/spreadsheets',

  async call(url,opts){
    if(!Google.signedIn()) throw new Error('Not signed in, or the session has expired.');
    const r=await fetch(url, Object.assign({},opts,{headers:Object.assign(
      {Authorization:'Bearer '+Google.token,'Content-Type':'application/json'},
      (opts&&opts.headers)||{})}));
    if(!r.ok){
      let msg=r.status+' '+r.statusText;
      try{ const j=await r.json(); if(j.error&&j.error.message) msg=j.error.message; }catch(e){}
      if(r.status===401){ Google.token=null; msg='The session expired — sign in again.'; }
      if(r.status===403) msg='Access denied. Check that this account can edit the spreadsheet, and that the Sheets API is enabled. ('+msg+')';
      if(r.status===404) msg='No spreadsheet with that ID, or this account cannot see it.';
      throw new Error(msg);
    }
    return r.status===204 ? null : r.json();
  },

  meta(id){ return Sheets.call(`${Sheets.base}/${id}?fields=properties.title,sheets.properties`); },

  async ensureTabs(id){
    const info=await Sheets.meta(id);
    const have=new Set((info.sheets||[]).map(s=>s.properties.title));
    const add=DB.TABS().filter(t=>!have.has(t));
    if(add.length){
      await Sheets.call(`${Sheets.base}/${id}:batchUpdate`,{method:'POST',
        body:JSON.stringify({requests:add.map(title=>({addSheet:{properties:{title}}}))})});
    }
    /* header row on every tab, and freeze it */
    const data=DB.TABS().map(t=>({range:`${t}!A1`,values:[DB.SCHEMA[t]]}));
    await Sheets.call(`${Sheets.base}/${id}/values:batchUpdate`,{method:'POST',
      body:JSON.stringify({valueInputOption:'RAW',data})});
    const fresh=await Sheets.meta(id);
    const byName={}; (fresh.sheets||[]).forEach(s=>byName[s.properties.title]=s.properties.sheetId);
    await Sheets.call(`${Sheets.base}/${id}:batchUpdate`,{method:'POST',
      body:JSON.stringify({requests:DB.TABS().map(t=>({updateSheetProperties:{
        properties:{sheetId:byName[t],gridProperties:{frozenRowCount:1}},
        fields:'gridProperties.frozenRowCount'}}))})});
    return {title:info.properties.title, created:add, tabs:DB.TABS(), ids:byName};
  },

  /* Remove any rows already published for this reference and revision, so a
     re-publish replaces its own snapshot rather than piling up duplicates.
     Different revisions are left alone — that history is the point. */
  async purge(id, ids, tab, ref, rev){
    const got=await Sheets.call(`${Sheets.base}/${id}/values/${encodeURIComponent(tab+'!A2:B')}`);
    const rows=got.values||[];
    const kill=[];
    rows.forEach((r,i)=>{ if(String(r[0]??'')===String(ref) && String(r[1]??'')===String(rev)) kill.push(i+1); });
    if(!kill.length) return 0;
    const ranges=[]; let a=kill[0], b=kill[0];
    for(let i=1;i<kill.length;i++){
      if(kill[i]===b+1){ b=kill[i]; } else { ranges.push([a,b]); a=b=kill[i]; }
    }
    ranges.push([a,b]);
    await Sheets.call(`${Sheets.base}/${id}:batchUpdate`,{method:'POST',
      body:JSON.stringify({requests:ranges.reverse().map(([s,e])=>({deleteDimension:{range:{
        sheetId:ids[tab],dimension:'ROWS',startIndex:s,endIndex:e+1}}}))})});
    return kill.length;
  },

  async append(id, tab, rows){
    if(!rows.length) return 0;
    await Sheets.call(
      `${Sheets.base}/${id}/values/${encodeURIComponent(tab+'!A1')}:append`+
      `?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,
      {method:'POST',body:JSON.stringify({values:rows})});
    return rows.length;
  },

  async readTab(id, tab){
    const got=await Sheets.call(`${Sheets.base}/${id}/values/${encodeURIComponent(tab)}`);
    const v=got.values||[];
    if(v.length<2) return [];
    const head=v[0];
    return v.slice(1).map(r=>{ const o={};
      head.forEach((h,i)=>{ const raw=r[i];
        o[h] = (raw===''||raw===undefined) ? '' : (isNaN(raw)||raw===null ? raw : +raw); });
      return o; });
  }
};
/* ══════════════════════════════════════════════════════════════
   DARKWIZ QS — Reporting
   Reads the Google Sheet written by the estimating app. Read-only:
   nothing here writes back. Money arrives in peso and is converted
   for display only.
   ══════════════════════════════════════════════════════════════ */

const Store={_m:{},
  get(k){ try{ const v=localStorage.getItem(k); return v===null?(this._m[k]??null):v; }catch(e){ return this._m[k]??null; } },
  set(k,v){ this._m[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }};

let CFG=(function(){
  try{ const r=Store.get('darkwiz_rep_v1'); if(r) return JSON.parse(r); }catch(e){}
  return {clientId:'',sheetId:'',currency:'PHP',fx:58.5,rail:true};
})();
const saveCfg=()=>{ try{ Store.set('darkwiz_rep_v1',JSON.stringify(CFG)); }catch(e){} };

let DATA=null, LOADED=null, FILT={project:'',status:'',from:'',to:''};

/* ── formatting ─────────────────────────────────────────────── */
const U={ sym:()=>CFG.currency==='USD'?'$':'\u20b1',
          fx:()=>CFG.currency==='USD'?(+CFG.fx||58.5):1,
          money:v=>(+v||0)/U.fx() };
const F={
  n(v,d=2){ if(v===''||v==null||isNaN(v)) return '\u2014';
    return (+v).toLocaleString('en-PH',{minimumFractionDigits:d,maximumFractionDigits:d}); },
  wrap(sym,txt){ return '<span class="money"><i>'+sym+'</i><b>'+txt+'</b></span>'; },
  m(v,d=2){ return F.wrap(U.sym(),F.n(U.money(v),d)); },
  short(v){ const x=U.money(v),a=Math.abs(x); let t;
    if(a>=1e9) t=F.n(x/1e9,2)+'B'; else if(a>=1e6) t=F.n(x/1e6,2)+'M';
    else if(a>=1e3) t=F.n(x/1e3,1)+'K'; else t=F.n(x,0);
    return F.wrap(U.sym(),t); },
  pct(v,d=1){ return F.n(v,d)+'%'; },
  esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
};
const toast=(m,bad)=>{ const el=document.getElementById('toast'); if(!el) return;
  el.textContent=m; el.className='on'+(bad?' bad':'');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.className='',bad?5200:2800); };

/* ── report definitions ─────────────────────────────────────── */
const REPORTS=[
  {id:'portfolio',code:'P1',name:'Portfolio dashboard',
   note:'Every published project side by side \u2014 contract value, billed to date, cost incurred and the margin that falls out of the two.'},
  {id:'rates',code:'P2',name:'Rate benchmarking',
   note:'How the same pay item has been priced across jobs. Wide spreads are where an estimate is being carried by assumption rather than by evidence.'},
  {id:'billing',code:'P3',name:'Billing & cash position',
   note:'What has been certified, what is still to bill, and how much of your money is sitting in retention.'},
  {id:'materials',code:'P4',name:'Material spend',
   note:'Aggregate quantities and value by material across the portfolio \u2014 the basis for a volume conversation with suppliers.'},
  {id:'setup',code:'S1',name:'Connection',
   note:'Which spreadsheet this page reads, and which Google account it reads with.'}
];
let VIEW='portfolio';

/* ── data shaping ───────────────────────────────────────────── */
/* Each project is keyed by reference and revision. Every report reads the
   latest revision of each project, so a superseded rev-0 estimate never
   pollutes a comparison. Older revisions stay in the Sheet as the audit trail. */
const D={
  projects(){ return (DATA&&DATA.Projects)||[]; },
  latest(){
    const by=new Map();
    D.projects().forEach(p=>{
      const k=p.Ref, cur=by.get(k);
      if(!cur || String(p.PublishedAt) > String(cur.PublishedAt)) by.set(k,p);
    });
    return [...by.values()];
  },
  filtered(){
    let list=D.latest();
    if(FILT.project) list=list.filter(p=>p.Ref===FILT.project);
    if(FILT.from) list=list.filter(p=>String(p.ProjectDate||'')>=FILT.from);
    if(FILT.to)   list=list.filter(p=>String(p.ProjectDate||'')<=FILT.to);
    return list.sort((a,b)=>String(a.Ref).localeCompare(String(b.Ref),'en',{numeric:true}));
  },
  keys(){ return new Set(D.filtered().map(p=>p.Ref+'\u241f'+p.Rev)); },
  rows(tab){
    const k=D.keys();
    return ((DATA&&DATA[tab])||[]).filter(r=>k.has(r.Ref+'\u241f'+r.Rev));
  },
  ref(r){ const p=D.latest().find(x=>x.Ref===r); return p?(p.Name||r):r; }
};

/* ── shared bits ────────────────────────────────────────────── */
function card(title,code,body,desc){
  return `<section class="card"><header><h3>${title}</h3>${code?`<span class="code">${code}</span>`:''}
    <span class="sp"></span>${desc?`<p>${desc}</p>`:''}</header>${body}</section>`;
}
function kpi(list){
  return `<div class="kpis">`+list.map(k=>`<div class="kpi ${k.tone||''}"><b>${k.l}</b>
    <span>${k.v}</span>${k.s?`<small>${k.s}</small>`:''}</div>`).join('')+`</div>`;
}
function bar(pct,cls){ return `<div class="track"><i class="${cls||''}" style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`; }
function filterBar(){
  const ps=D.latest().sort((a,b)=>String(a.Ref).localeCompare(String(b.Ref),'en',{numeric:true}));
  return `<div class="filters noprint">
    <select onchange="R.filt('project',this.value)">
      <option value="">All projects (${ps.length})</option>
      ${ps.map(p=>`<option value="${F.esc(p.Ref)}" ${FILT.project===p.Ref?'selected':''}>${F.esc(p.Ref)} \u2014 ${F.esc(p.Name||'')}</option>`).join('')}
    </select>
    <label style="font-size:12px;color:var(--muted)">from
      <input type="date" value="${F.esc(FILT.from)}" onchange="R.filt('from',this.value)"></label>
    <label style="font-size:12px;color:var(--muted)">to
      <input type="date" value="${F.esc(FILT.to)}" onchange="R.filt('to',this.value)"></label>
    ${(FILT.project||FILT.from||FILT.to)?`<button class="btn" onclick="R.clearFilt()">Clear filters</button>`:''}
    <span style="flex:1"></span>
    <span style="font-size:12px;color:var(--muted)">${D.filtered().length} project${D.filtered().length===1?'':'s'} shown</span>
  </div>`;
}
function noData(what){
  return `<div class="card"><div class="empty"><h4>Nothing to report yet</h4>
    <p>${what}</p></div></div>`;
}

/* ── P1 · Portfolio dashboard ───────────────────────────────── */
const RV={};
RV.portfolio = () => {
  const ps=D.filtered();
  if(!ps.length) return filterBar()+noData('Publish a project from the estimating app and it will appear here.');
  const bill=D.rows('Billing'), cc=D.rows('CostControl');
  const rows=ps.map(p=>{
    const b=bill.find(x=>x.Ref===p.Ref&&x.Rev===p.Rev)||{};
    const cost=cc.filter(x=>x.Ref===p.Ref&&x.Rev===p.Rev)
                 .reduce((a,x)=>a+(+x.Actual||0)+(+x.OpenCommitment||0),0);
    const contract=+p.ABC||0, billed=+b.BilledToDate||0;
    return {ref:p.Ref,rev:p.Rev,name:p.Name||'',client:p.Client||'',date:p.ProjectDate||'',
            contract,billed,cost,margin:billed-cost,
            marginPct:billed?(billed-cost)/billed*100:0,
            progress:contract?billed/contract*100:0,
            retention:+b.RetentionHeld||0};
  });
  const T=rows.reduce((a,r)=>({contract:a.contract+r.contract,billed:a.billed+r.billed,
    cost:a.cost+r.cost,retention:a.retention+r.retention}),{contract:0,billed:0,cost:0,retention:0});
  const marg=T.billed?(T.billed-T.cost)/T.billed*100:0;

  const body=rows.map(r=>`<tr>
    <td class="num">${F.esc(r.ref)}</td>
    <td>${F.esc(r.name)}<div style="font-size:11.5px;color:var(--muted)">${F.esc(r.client)}</div></td>
    <td class="n num">${F.m(r.contract)}</td>
    <td class="n num">${F.m(r.billed)}</td>
    <td class="n num">${F.m(r.cost)}</td>
    <td class="n num calc">${F.m(r.margin)}</td>
    <td class="n"><span class="pill ${r.marginPct<0?'r':(r.marginPct<10?'y':'g')}">${F.pct(r.marginPct)}</span></td>
    <td style="min-width:150px"><div style="display:flex;align-items:center;gap:8px">
      <div class="bar"><i style="width:${Math.min(100,r.progress)}%"></i></div>
      <span class="num" style="font-size:12px">${F.n(r.progress,0)}%</span></div></td>
    <td class="num" style="font-size:12px;color:var(--muted)">rev ${F.esc(r.rev)}</td></tr>`).join('');

  const chart=[...rows].sort((a,b)=>b.contract-a.contract).slice(0,12);
  const max=Math.max(...chart.map(r=>r.contract),1);

  return `
  ${kpi([
    {l:'Contract value',v:F.short(T.contract),tone:'hi',s:rows.length+' projects'},
    {l:'Billed to date',v:F.short(T.billed),s:T.contract?F.pct(T.billed/T.contract*100)+' of portfolio':''},
    {l:'Cost incurred',v:F.short(T.cost),s:'actual plus commitment'},
    {l:'Gross margin',v:F.short(T.billed-T.cost),tone:marg<0?'warn':'ok',s:F.pct(marg)+' on revenue'},
    {l:'Retention held',v:F.short(T.retention),tone:T.retention>0?'warn':'',s:'yours, not yet released'}
  ])}
  ${filterBar()}
  ${card('Projects','P1',
    `<div class="tw"><table><thead><tr><th>Reference</th><th>Project</th>
      <th class="n">Contract</th><th class="n">Billed</th><th class="n">Cost</th>
      <th class="n">Margin</th><th class="n">%</th><th>Progress</th><th>Rev</th></tr></thead>
      <tbody>${body}
      <tr class="tot"><td colspan="2">Portfolio total</td>
        <td class="n">${F.m(T.contract)}</td><td class="n">${F.m(T.billed)}</td>
        <td class="n">${F.m(T.cost)}</td><td class="n">${F.m(T.billed-T.cost)}</td>
        <td class="n">${F.pct(marg)}</td><td></td><td></td></tr></tbody></table></div>`)}
  ${card('Contract value and cost','Largest projects',
    `<div class="pad"><div class="bars">
      ${chart.map(r=>`<div class="barrow">
        <span class="lbl" title="${F.esc(r.name)}">${F.esc(r.ref)}</span>
        <div class="track" style="position:relative">
          <i style="width:${r.contract/max*100}%"></i>
          <i class="b" style="width:${Math.min(100,r.cost/max*100)}%;margin-top:-16px;height:16px;opacity:.85"></i>
        </div>
        <span class="val">${F.short(r.contract)}</span></div>`).join('')}
      </div>
      <p class="hint" style="margin:14px 0 0">Teal is contract value, amber is cost incurred. Where the amber approaches the teal, the margin is being consumed.</p>
    </div>`)}`;
};

/* ── P2 · Rate benchmarking ─────────────────────────────────── */
RV.rates = () => {
  const boq=D.rows('BOQ');
  if(!boq.length) return filterBar()+noData('Rate comparison needs at least one published bill of quantities.');
  const by=new Map();
  boq.forEach(r=>{
    const k=r.PayItem; if(!k) return;
    const cur=by.get(k)||{item:k,desc:r.Description,unit:r.Unit,obs:[]};
    cur.obs.push({ref:r.Ref,rev:r.Rev,rate:+r.DirectRate||0,bid:+r.BidRate||0,
      qty:+r.Qty||0,amt:+r.Amount||0,
      lab:+r.LabourRate||0,eqp:+r.EquipmentRate||0,mat:+r.MaterialRate||0});
    by.set(k,cur);
  });
  const stats=[...by.values()].map(g=>{
    const rs=g.obs.map(o=>o.rate).filter(x=>x>0);
    const min=rs.length?Math.min(...rs):0, max=rs.length?Math.max(...rs):0;
    const avg=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:0;
    return {...g,n:g.obs.length,jobs:new Set(g.obs.map(o=>o.ref)).size,
      min,max,avg,spread:avg?(max-min)/avg*100:0,
      value:g.obs.reduce((a,o)=>a+o.amt,0)};
  }).filter(s=>s.jobs>0);

  const multi=stats.filter(s=>s.jobs>1).sort((a,b)=>b.spread-a.spread);
  const sorted=[...stats].sort((a,b)=>b.value-a.value);

  const spreadCell=s=>{
    if(s.jobs<2) return '<span style="font-size:12px;color:var(--muted)">one job</span>';
    const lo=s.min,hi=s.max,rng=hi-lo||1;
    return `<div class="spread"><div class="rail2">
      <i style="left:0;width:100%"></i>
      ${s.obs.filter(o=>o.rate>0).map(o=>`<b style="left:${(o.rate-lo)/rng*100}%" title="${F.esc(o.ref)}"></b>`).join('')}
      </div><span class="num" style="font-size:11.5px">${F.pct(s.spread,0)}</span></div>`;
  };

  return `
  ${kpi([
    {l:'Pay items priced',v:stats.length},
    {l:'Seen on more than one job',v:multi.length,tone:'hi'},
    {l:'Widest spread',v:multi[0]?F.pct(multi[0].spread,0):'\u2014',s:multi[0]?multi[0].item:''},
    {l:'Comparable value',v:F.short(multi.reduce((a,s)=>a+s.value,0))}
  ])}
  ${filterBar()}
  ${multi.length?card('Widest rate spreads','Worth a look',
    `<div class="pad" style="padding-bottom:0"><p class="hint">Pay items you have priced on more than one job, ordered by how far apart those prices sit. A wide spread is not automatically wrong \u2014 site access, height and volume all move a rate legitimately \u2014 but it is where an estimate is most likely to be carrying an assumption nobody has revisited.</p></div>
     <div class="tw"><table><thead><tr><th>Pay item</th><th>Description</th><th>Unit</th>
      <th class="n">Jobs</th><th class="n">Lowest</th><th class="n">Average</th><th class="n">Highest</th>
      <th>Spread</th><th class="n">Value priced</th></tr></thead><tbody>
      ${multi.slice(0,25).map(s=>`<tr>
        <td class="num">${F.esc(s.item)}</td><td>${F.esc(s.desc)}</td><td>${F.esc(s.unit)}</td>
        <td class="n num">${s.jobs}</td>
        <td class="n num">${F.m(s.min)}</td><td class="n num calc">${F.m(s.avg)}</td>
        <td class="n num">${F.m(s.max)}</td>
        <td>${spreadCell(s)}</td>
        <td class="n num">${F.m(s.value)}</td></tr>`).join('')}
     </tbody></table></div>`):''}
  ${card('Every pay item','By value priced',
    `<div class="tw"><table><thead><tr><th>Pay item</th><th>Description</th><th>Unit</th>
      <th class="n">Jobs</th><th class="n">Direct rate</th><th class="n">Bid rate</th>
      <th class="n">Labour</th><th class="n">Equipment</th><th class="n">Material</th>
      <th class="n">Value priced</th></tr></thead><tbody>
      ${sorted.map(s=>{ const o=s.obs[s.obs.length-1];
        return `<tr><td class="num">${F.esc(s.item)}</td><td>${F.esc(s.desc)}</td><td>${F.esc(s.unit)}</td>
        <td class="n num">${s.jobs}</td>
        <td class="n num">${F.m(s.avg)}</td><td class="n num">${F.m(o.bid)}</td>
        <td class="n num">${F.m(o.lab)}</td><td class="n num">${F.m(o.eqp)}</td><td class="n num">${F.m(o.mat)}</td>
        <td class="n num calc">${F.m(s.value)}</td></tr>`;}).join('')}
     </tbody></table></div>
     <div class="pad"><div class="note"><b>What this can and cannot tell you.</b> These are the rates you <i>priced</i>, compared across jobs and revisions \u2014 useful for spotting drift and for defending a number in a tender review. It is not actual versus estimated, because the estimating app records real cost by element (materials, labour, equipment) rather than against each pay item. Closing that loop would mean capturing site cost per pay item, which is a change to how cost is booked, not just a report.</div></div>`)}`;
};

/* ── P3 · Billing & cash position ───────────────────────────── */
RV.billing = () => {
  const bl=D.rows('Billing');
  if(!bl.length) return filterBar()+noData('Billing figures appear once a project with a progress billing has been published.');
  const rows=bl.map(b=>{
    const contract=+b.ContractAmount||0, toDate=+b.BilledToDate||0;
    return {ref:b.Ref,rev:b.Rev,no:b.BillingNo,from:b.PeriodFrom,to:b.PeriodTo,
      name:D.ref(b.Ref),contract,prev:+b.BilledPrevious||0,now:+b.BilledThisPeriod||0,
      toDate,pct:+b.PctComplete||0,retPct:+b.RetentionPct||0,ret:+b.RetentionHeld||0,
      rec:+b.Recoupment||0,net:+b.NetDue||0,unbilled:contract-toDate};
  }).sort((a,b)=>String(a.ref).localeCompare(String(b.ref),'en',{numeric:true}));
  const T=rows.reduce((a,r)=>({contract:a.contract+r.contract,toDate:a.toDate+r.toDate,
    now:a.now+r.now,ret:a.ret+r.ret,net:a.net+r.net,unbilled:a.unbilled+r.unbilled}),
    {contract:0,toDate:0,now:0,ret:0,net:0,unbilled:0});

  return `
  ${kpi([
    {l:'Contract value',v:F.short(T.contract)},
    {l:'Certified to date',v:F.short(T.toDate),tone:'hi',s:T.contract?F.pct(T.toDate/T.contract*100)+' complete':''},
    {l:'Still to bill',v:F.short(T.unbilled),s:'work in the contract, not yet certified'},
    {l:'Retention held',v:F.short(T.ret),tone:T.ret>0?'warn':'',s:'released on completion'},
    {l:'Net due this period',v:F.short(T.net),tone:'ok'}
  ])}
  ${filterBar()}
  ${card('Billing position by project','P3',
    `<div class="tw"><table><thead><tr><th>Reference</th><th>Project</th><th class="n">Bill no.</th>
      <th class="n">Contract</th><th class="n">This period</th><th class="n">To date</th>
      <th>Complete</th><th class="n">Still to bill</th><th class="n">Retention</th>
      <th class="n">Recoupment</th><th class="n">Net due</th></tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td class="num">${F.esc(r.ref)}</td><td>${F.esc(r.name)}</td>
        <td class="n num">${F.esc(r.no)}</td>
        <td class="n num">${F.m(r.contract)}</td>
        <td class="n num">${F.m(r.now)}</td>
        <td class="n num calc">${F.m(r.toDate)}</td>
        <td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px">
          <div class="bar"><i class="${r.pct>=100?'':(r.pct>=50?'near':'')}" style="width:${Math.min(100,r.pct)}%"></i></div>
          <span class="num" style="font-size:12px">${F.n(r.pct,0)}%</span></div></td>
        <td class="n num">${F.m(r.unbilled)}</td>
        <td class="n num">${F.m(r.ret)}</td>
        <td class="n num">${F.m(r.rec)}</td>
        <td class="n num calc">${F.m(r.net)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="3">Total</td>
        <td class="n">${F.m(T.contract)}</td><td class="n">${F.m(T.now)}</td>
        <td class="n">${F.m(T.toDate)}</td><td></td>
        <td class="n">${F.m(T.unbilled)}</td><td class="n">${F.m(T.ret)}</td>
        <td></td><td class="n">${F.m(T.net)}</td></tr>
     </tbody></table></div>`)}
  ${card('Where the money sits','Cash view',
    `<div class="pad"><div class="bars">
      ${[['Certified and paid out, less retention',T.toDate-T.ret,''],
         ['Retention held against you',T.ret,'b'],
         ['Still to bill',T.unbilled,'c']]
        .map(([l,v,c])=>`<div class="barrow"><span class="lbl">${l}</span>
          ${bar(T.contract?v/T.contract*100:0,c)}
          <span class="val">${F.short(v)}</span></div>`).join('')}
     </div>
     <p class="hint" style="margin:14px 0 0">Retention is money already earned that the client is holding \u2014 typically 10% of each progress payment under RA 9184, released on completion and final acceptance. Across ${rows.length} project${rows.length===1?'':'s'} that is <b>${F.m(T.ret)}</b> sitting outside your cash position.</p>
     </div>`)}`;
};

/* ── P4 · Material spend ────────────────────────────────────── */
RV.materials = () => {
  const mat=D.rows('Materials');
  if(!mat.length) return filterBar()+noData('Material figures come from the bill of materials \u2014 published projects need take-off lines with a material basis.');
  const by=new Map();
  mat.forEach(m=>{
    const k=m.Material; if(!k) return;
    const c=by.get(k)||{name:k,cat:m.Category||'Uncategorised',unit:m.Unit||'',
                        qty:0,amt:0,jobs:new Set(),rates:[]};
    c.qty+=+m.Qty||0; c.amt+=+m.Amount||0; c.jobs.add(m.Ref);
    if(+m.Rate) c.rates.push(+m.Rate);
    by.set(k,c);
  });
  const items=[...by.values()].map(x=>({...x,
    jobsN:x.jobs.size,
    rateMin:x.rates.length?Math.min(...x.rates):0,
    rateMax:x.rates.length?Math.max(...x.rates):0
  })).sort((a,b)=>b.amt-a.amt);
  const total=items.reduce((a,x)=>a+x.amt,0);

  const cats=new Map();
  items.forEach(i=>cats.set(i.cat,(cats.get(i.cat)||0)+i.amt));
  const catList=[...cats.entries()].sort((a,b)=>b[1]-a[1]);
  const maxCat=catList.length?catList[0][1]:1;

  let run=0; const top=items.filter(i=>{ const keep=run<total*0.8; run+=i.amt; return keep; });

  return `
  ${kpi([
    {l:'Material value',v:F.short(total),tone:'hi'},
    {l:'Distinct materials',v:items.length},
    {l:'Categories',v:catList.length},
    {l:'80% of spend sits in',v:top.length+' items',s:'the list worth negotiating'}
  ])}
  ${filterBar()}
  ${card('Spend by category','Where the money goes',
    `<div class="pad"><div class="bars">
      ${catList.map(([c,v])=>`<div class="barrow"><span class="lbl">${F.esc(c)}</span>
        ${bar(v/maxCat*100)}
        <span class="val">${F.short(v)} \u00b7 ${F.pct(v/total*100,0)}</span></div>`).join('')}
     </div></div>`)}
  ${card('Materials by value','P4',
    `<div class="pad" style="padding-bottom:0"><p class="hint">Quantities are summed across the projects in view, so this is the volume you could put in front of a supplier. Where the lowest and highest rate differ, you have paid both \u2014 which is the opening for a portfolio price.</p></div>
     <div class="tw"><table><thead><tr><th>Material</th><th>Category</th><th>Unit</th>
      <th class="n">Total quantity</th><th class="n">Jobs</th>
      <th class="n">Lowest rate</th><th class="n">Highest rate</th><th class="n">Value</th>
      <th class="n">Share</th></tr></thead><tbody>
      ${items.map(i=>`<tr>
        <td>${F.esc(i.name)}</td>
        <td style="font-size:12px;color:var(--muted)">${F.esc(i.cat)}</td>
        <td>${F.esc(i.unit)}</td>
        <td class="n num">${F.n(i.qty,2)}</td>
        <td class="n num">${i.jobsN}</td>
        <td class="n num">${F.m(i.rateMin)}</td>
        <td class="n num">${i.rateMax>i.rateMin?F.m(i.rateMax):'\u2014'}</td>
        <td class="n num calc">${F.m(i.amt)}</td>
        <td class="n num">${F.pct(total?i.amt/total*100:0)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="7">Total material value</td>
        <td class="n">${F.m(total)}</td><td class="n">100.0%</td></tr>
     </tbody></table></div>`)}`;
};

/* ── S1 · Connection ────────────────────────────────────────── */
RV.setup = () => {
  const on=Google.signedIn();
  return `
  ${card('Connection','Google Sheets',`<div class="pad">
    <p class="hint">This page reads the spreadsheet your estimating app publishes to. Use the same two IDs you set up there. Nothing on this page writes back \u2014 it only reads.</p>
    <div class="fgrid">
      <div class="f"><label>OAuth client ID</label>
        <input value="${F.esc(CFG.clientId||'')}" placeholder="\u2026apps.googleusercontent.com"
               onchange="R.cfg('clientId',this.value)"></div>
      <div class="f"><label>Spreadsheet ID</label>
        <input value="${F.esc(CFG.sheetId||'')}" placeholder="the long string in the Sheet URL"
               onchange="R.cfg('sheetId',this.value)"></div>
      <div class="f"><label>Status</label>
        <input class="ro" readonly value="${on?'Signed in'+(Google.email?' \u2014 '+Google.email:''):'Signed out'}"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      ${on?`<button class="btn" onclick="R.signOut()">Sign out</button>`
          :`<button class="btn pri" onclick="R.auth()">Sign in with Google</button>`}
      <button class="btn" ${on?'':'disabled'} onclick="R.load()">Load data</button>
    </div>
    ${location.protocol==='file:'?`<div class="note" style="margin-top:14px">This page is open from disk. Google will not permit sign-in from a <code>file://</code> address \u2014 use the copy hosted on GitHub Pages.</div>`:''}
    </div>`)}
  ${DATA?card('What is loaded','Snapshot',
    `<div class="tw"><table><thead><tr><th>Tab</th><th class="n">Rows</th></tr></thead><tbody>
      ${Object.keys(DATA).map(k=>`<tr><td class="num">${k}</td><td class="n num">${DATA[k].length}</td></tr>`).join('')}
     </tbody></table></div>
     <div class="pad"><p class="hint">Loaded ${F.esc(LOADED||'')}. Press <b>Refresh data</b> after someone publishes a new revision.</p></div>`):''}`;
};

/* ── controller ─────────────────────────────────────────────── */
const R={
  go(id){ VIEW=id; R.render(); window.scrollTo(0,0);
          document.body.classList.remove('nav-open'); },
  rail(show){ CFG.rail=!!show; saveCfg(); R.render(); },
  cfg(k,v){ CFG[k]=String(v||'').trim(); saveCfg(); R.render(); },
  filt(k,v){ FILT[k]=v; R.render(); },
  clearFilt(){ FILT={project:'',status:'',from:'',to:''}; R.render(); },
  currency(v){ CFG.currency=v; saveCfg(); R.render(); },

  render(){
    document.body.classList.toggle('rail-off', CFG.rail===false);
    document.getElementById('nav').innerHTML=
      `<div class="navgrp"><h4>Reports</h4>`+
      REPORTS.filter(r=>r.id!=='setup').map(r=>
        `<button class="navbtn ${r.id===VIEW?'on':''}" onclick="R.go('${r.id}')">
          <span class="cd">${r.code}</span><span>${F.esc(r.name)}</span></button>`).join('')+
      `</div><div class="navgrp"><h4>Set-up</h4>`+
      REPORTS.filter(r=>r.id==='setup').map(r=>
        `<button class="navbtn ${r.id===VIEW?'on':''}" onclick="R.go('${r.id}')">
          <span class="cd">${r.code}</span><span>${F.esc(r.name)}</span></button>`).join('')+
      `</div>`;

    const r=REPORTS.find(x=>x.id===VIEW)||REPORTS[0];
    const g=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
    g('tbCode',r.code); g('tbTitle',r.name); g('tbNote',r.note);
    g('tbProj',DATA?String(D.latest().length):'\u2014');
    g('tbRev',DATA?String(D.projects().length):'\u2014');
    g('tbCur',CFG.currency==='USD'?'USD @ \u20b1'+F.n(CFG.fx,2):'PHP (\u20b1)');
    g('tbLoad',LOADED||'not loaded');

    document.querySelectorAll('#segCur button').forEach(b=>b.classList.toggle('on',b.dataset.v===CFG.currency));
    const fx=document.getElementById('fxRate');
    if(fx && document.activeElement!==fx) fx.value=CFG.fx;

    const on=Google.signedIn();
    const as=document.getElementById('authState');
    if(as){ as.className='savestate'+(on?'':' dirty');
            as.textContent=on?(Google.email||'signed in'):'signed out'; }
    const ba=document.getElementById('btnAuth');
    if(ba){ ba.textContent=on?'Sign out':'Sign in with Google';
            ba.onclick=on?R.signOut:R.auth; }

    let html;
    if(!DATA && VIEW!=='setup'){
      html=`<div class="card"><div class="empty">
        <h4>${on?'No data loaded yet':'Sign in to read the database'}</h4>
        <p>${on?'Press <b>Refresh data</b> to pull the latest published projects.'
               :'This page reads a Google Sheet that only your team can see, so it needs your Google account.'}</p>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          ${on?`<button class="btn pri" onclick="R.load()">Refresh data</button>`
              :`<button class="btn pri" onclick="R.auth()">Sign in with Google</button>`}
          <button class="btn" onclick="R.go('setup')">Connection settings</button>
        </div></div></div>`;
    } else html=(RV[VIEW]||RV.setup)();
    document.getElementById('sheet').innerHTML=html;
  },

  async auth(){
    try{
      if(!CFG.clientId){ R.go('setup'); toast('Set the OAuth client ID first.',true); return; }
      await Google.signIn(CFG.clientId);
      toast('Signed in'+(Google.email?' as '+Google.email:''));
      await R.load();
    }catch(e){ R.render(); toast(e.message,true); }
  },
  signOut(){ Google.signOut(); DATA=null; LOADED=null; R.render(); toast('Signed out'); },

  async load(){
    if(!Google.signedIn()) return R.auth();
    if(!CFG.sheetId){ R.go('setup'); toast('Set the spreadsheet ID first.',true); return; }
    try{
      toast('Reading the spreadsheet\u2026');
      const out={};
      for(const tab of DB.TABS()){
        if(tab==='_Meta') continue;
        try{ out[tab]=await Sheets.readTab(CFG.sheetId,tab); }
        catch(e){ out[tab]=[]; }
      }
      DATA=out;
      LOADED=new Date().toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'});
      const n=D.latest().length;
      R.render();
      toast(n?`Loaded ${n} project${n===1?'':'s'}.`:'Connected, but no projects have been published yet.',!n);
    }catch(e){ toast(e.message,true); R.render(); }
  },

  csv(){
    const tables=[...document.querySelectorAll('#sheet table')];
    if(!tables.length){ toast('Nothing to export on this report.',true); return; }
    const esc=s=>{ s=String(s).replace(/\s+/g,' ').replace(/[\u25b2\u25bc]/g,'').trim();
      return /[",]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const r=REPORTS.find(x=>x.id===VIEW);
    const out=[[esc('DARKWIZ QS \u2014 '+r.name)],
               [esc('Currency: '+CFG.currency+'; loaded '+(LOADED||''))],[]];
    tables.forEach(t=>{ [...t.rows].forEach(tr=>{
      out.push([...tr.cells].map(td=>{
        const m=td.querySelector('.money');
        if(m) return esc(m.querySelector('i').textContent+' '+m.querySelector('b').textContent);
        return esc(td.textContent); })); }); out.push([]); });
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+out.map(x=>x.join(',')).join('\r\n')],
      {type:'text/csv;charset=utf-8'}));
    a.download='DARKWIZ Reports - '+r.name+' - '+new Date().toISOString().slice(0,10)+'.csv';
    a.click(); URL.revokeObjectURL(a.href);
  }
};

document.querySelectorAll('#segCur button').forEach(b=>b.onclick=()=>R.currency(b.dataset.v));
document.getElementById('fxRate').addEventListener('change',e=>{
  CFG.fx=parseFloat(e.target.value)||58.5; saveCfg(); R.render(); });

R.render();
Object.assign(window,{R,RV,D,F,U,DB,Google,Sheets,REPORTS,FILT,
  __data:()=>DATA, __setData:d=>{DATA=d;LOADED='test';}, __cfg:()=>CFG});

</script>
</body>
</html>
