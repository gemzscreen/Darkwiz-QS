<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARKWIZ QS — Estimating &amp; Cost Control</title>
<meta name="description" content="DARKWIZ QS — Philippine quantity surveying suite: take-off, DUPA, BOQ, cost control and progress billing. NSCP 2015 / DPWH / RA 9184.">
<meta name="theme-color" content="#16202B">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2316202B'/%3E%3Crect x='11' y='8' width='29' height='38' rx='2.5' fill='%23F2F4F6'/%3E%3Cg fill='%230B5D6B'%3E%3Crect x='16' y='14' width='19' height='3' rx='1.5'/%3E%3Crect x='16' y='21' width='13' height='3' rx='1.5'/%3E%3Crect x='16' y='28' width='16' height='3' rx='1.5'/%3E%3C/g%3E%3Cg transform='rotate(-32 38 44)'%3E%3Crect x='19' y='37' width='40' height='14' rx='2.5' fill='%23C8940A'/%3E%3Cg stroke='%2316202B' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M26 37v5'/%3E%3Cpath d='M32 37v8'/%3E%3Cpath d='M38 37v5'/%3E%3Cpath d='M44 37v8'/%3E%3Cpath d='M50 37v5'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2316202B'/%3E%3Crect x='11' y='8' width='29' height='38' rx='2.5' fill='%23F2F4F6'/%3E%3Cg fill='%230B5D6B'%3E%3Crect x='16' y='14' width='19' height='3' rx='1.5'/%3E%3Crect x='16' y='21' width='13' height='3' rx='1.5'/%3E%3Crect x='16' y='28' width='16' height='3' rx='1.5'/%3E%3C/g%3E%3Cg transform='rotate(-32 38 44)'%3E%3Crect x='19' y='37' width='40' height='14' rx='2.5' fill='%23C8940A'/%3E%3Cg stroke='%2316202B' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M26 37v5'/%3E%3Cpath d='M32 37v8'/%3E%3Cpath d='M38 37v5'/%3E%3Cpath d='M44 37v8'/%3E%3Cpath d='M50 37v5'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202B; --ink-2:#1F2C3A; --ink-3:#2C3D4F;
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --rule:#CFD7E0; --rule-soft:#E3E9EE;
  --accent:#0B5D6B; --accent-lite:#128296; --accent-wash:#E4F1F3;
  --signal:#C8940A; --signal-wash:#FBF3DE;
  --good:#166E4D; --bad:#A32117; --muted:#61728A;
  --input:#FFFDF2; --input-rule:#D9C68B;
  --calc:#F3F7F4;
  --shadow:0 1px 2px rgba(22,32,43,.08),0 8px 24px rgba(22,32,43,.06);
  --rail:248px;
  --f-disp:'Barlow Condensed',Impact,sans-serif;
  --f-body:'IBM Plex Sans',-apple-system,Segoe UI,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-body); font-size:14px; color:var(--ink);
  background:var(--paper); -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent-lite)}

/* ── layout ─────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--ink); color:#C6D2DE;
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{
  font-family:var(--f-disp); font-size:26px; font-weight:700; letter-spacing:.06em;
  color:#fff; line-height:1; text-transform:uppercase;
}
.brand .mark span{color:var(--signal)}
.brand .sub{
  font-family:var(--f-mono,var(--f-num)); font-size:9.5px; letter-spacing:.18em;
  text-transform:uppercase; color:#7C8FA3; margin-top:6px;
}
.navgrp{padding:14px 0 2px}
.navgrp h4{
  margin:0 0 6px; padding:0 18px; font-family:var(--f-num); font-size:9.5px;
  font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:#5E7186;
}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 18px;border:0;
  background:none;color:#C6D2DE;text-align:left;cursor:pointer;font-size:13.5px;
  border-left:3px solid transparent;
}
.navbtn:hover{background:rgba(255,255,255,.05);color:#fff}
.navbtn.on{background:rgba(18,130,150,.22);color:#fff;border-left-color:var(--signal);font-weight:500}
.navbtn .cd{
  font-family:var(--f-num);font-size:9.5px;color:#6C8091;min-width:30px;
}
.navbtn.on .cd{color:var(--signal)}
.railfoot{padding:14px 18px 24px;font-size:11px;color:#5E7186;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ── title block (signature) ────────────────────────── */
.titleblock{
  background:var(--surface); border-bottom:2px solid var(--ink);
  display:grid; grid-template-columns:1fr auto; align-items:stretch;
}
.tb-left{padding:12px 22px 11px;min-width:0}
.tb-crumb{
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;gap:8px;align-items:center;
}
.tb-crumb .chip{
  background:var(--ink);color:#fff;padding:2px 7px;border-radius:2px;letter-spacing:.1em;
}
.tb-title{
  font-family:var(--f-disp);font-size:30px;font-weight:600;line-height:1.02;
  letter-spacing:.005em;margin:4px 0 2px;text-transform:uppercase;
}
.tb-note{font-size:12.5px;color:var(--muted);max-width:78ch;line-height:1.45}
.tb-grid{
  display:grid;grid-template-columns:repeat(4,minmax(96px,auto));
  border-left:1px solid var(--rule);
}
.tb-cell{
  padding:8px 14px;border-left:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);
  display:flex;flex-direction:column;justify-content:center;
}
.tb-cell:nth-child(-n+4){border-bottom:1px solid var(--rule)}
.tb-cell b{
  font-family:var(--f-num);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
}
.tb-cell span{font-size:13px;font-weight:500;margin-top:2px;white-space:nowrap}

/* ── toolbar ────────────────────────────────────────── */
.toolbar{
  background:var(--ink-2);color:#D5DEE7;padding:7px 22px;display:flex;
  align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:29;
}
.tgl{display:flex;align-items:center;gap:8px}
.tgl>b{
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7E93A8;font-weight:600;
}
.seg{display:flex;border:1px solid #3C5064;border-radius:3px;overflow:hidden}
.seg button{
  border:0;background:transparent;color:#9FB2C4;padding:4px 12px;cursor:pointer;
  font-family:var(--f-num);font-size:11px;font-weight:500;letter-spacing:.05em;
}
.seg button.on{background:var(--signal);color:#1B1405;font-weight:600}
.tbar-fx{
  width:74px;background:#101922;border:1px solid #3C5064;color:#D5DEE7;
  padding:3px 7px;border-radius:3px;font-family:var(--f-num);font-size:11.5px;text-align:right;
}
.tbar-sp{flex:1}
.tbtn{
  background:transparent;border:1px solid #3C5064;color:#B9C8D6;padding:4px 11px;
  border-radius:3px;cursor:pointer;font-size:12px;
}
.tbtn:hover{background:#2C3D4F;color:#fff}
.tbtn.pri{background:var(--accent-lite);border-color:var(--accent-lite);color:#fff}
.tbtn.pri:hover{background:#0F6E7F}

/* ── content ────────────────────────────────────────── */
.sheet{padding:22px 22px 80px;max-width:1500px}
.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden;
}
.card>header{
  padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.card>header h3{
  margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;
}
.card>header .code{
  font-family:var(--f-num);font-size:10px;background:var(--accent-wash);color:var(--accent);
  padding:2px 7px;border-radius:2px;letter-spacing:.08em;font-weight:600;
}
.card>header .sp{flex:1}
.card>header p{margin:0;font-size:12px;color:var(--muted)}
.pad{padding:16px}
.hint{
  font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 12px;
}
.note{
  background:var(--signal-wash);border-left:3px solid var(--signal);padding:9px 13px;
  font-size:12.5px;line-height:1.55;margin:0 0 14px;border-radius:0 3px 3px 0;
}
.note b{font-weight:600}

/* ── tables ─────────────────────────────────────────── */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:600;color:#405266;background:var(--surface-2);
  padding:7px 9px;text-align:left;border-bottom:2px solid var(--rule);white-space:nowrap;
}
th.n,td.n{text-align:right}
th.c,td.c{text-align:center}
td{padding:4px 9px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tbody tr:hover{background:#FAFCFD}
td.n,td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px}
tr.grp td{
  background:var(--ink-3);color:#fff;font-family:var(--f-disp);font-size:14px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:5px 9px;
}
tr.sum td{background:var(--calc);font-weight:600;border-top:1px solid var(--rule)}
tr.tot td{
  background:var(--ink);color:#fff;font-weight:600;
  font-family:var(--f-num);border-top:2px solid var(--ink);
}
tr.tot td:first-child{font-family:var(--f-disp);font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.calc{background:var(--calc);color:var(--accent);font-weight:500}

input.cell,select.cell,textarea.cell{
  width:100%;border:1px solid transparent;background:var(--input);
  border-bottom:1px solid var(--input-rule);padding:3px 6px;border-radius:2px;
}
input.cell:focus,select.cell:focus{outline:2px solid var(--accent-lite);outline-offset:-1px;background:#fff}
input.cell.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
select.cell{background:var(--input);cursor:pointer}
.iconbtn{
  border:1px solid var(--rule);background:#fff;color:var(--muted);width:24px;height:24px;
  border-radius:3px;cursor:pointer;line-height:1;font-size:14px;padding:0;
}
.iconbtn:hover{border-color:var(--bad);color:var(--bad);background:#FDF3F2}
.btn{
  border:1px solid var(--rule);background:#fff;padding:6px 13px;border-radius:3px;
  cursor:pointer;font-size:12.5px;font-weight:500;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-lite);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule-soft);background:var(--surface-2)}

/* ── forms & KPI ────────────────────────────────────── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px 16px}
.f label{
  display:block;font-family:var(--f-num);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px;
}
.f input,.f select,.f textarea{
  width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--input);
}
.f input:focus,.f select:focus{outline:2px solid var(--accent-lite);outline-offset:-1px}
.f .ro{background:var(--calc);color:var(--accent);font-family:var(--f-num);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--rule)}
.kpi{background:#fff;padding:13px 15px}
.kpi b{
  display:block;font-family:var(--f-num);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600;
}
.kpi span{
  display:block;font-family:var(--f-num);font-size:21px;font-weight:600;margin-top:5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.kpi small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.kpi.hi span{color:var(--accent)}
.kpi.warn span{color:var(--bad)}
.kpi.ok span{color:var(--good)}

.bar{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;background:var(--accent-lite)}
.bar i.over{background:var(--bad)}
.bar i.near{background:var(--signal)}

.pill{
  display:inline-block;font-family:var(--f-num);font-size:10px;padding:2px 7px;border-radius:10px;
  letter-spacing:.05em;font-weight:600;
}
.pill.a{background:var(--accent-wash);color:var(--accent)}
.pill.g{background:#E2F0EA;color:var(--good)}
.pill.r{background:#FBEBE9;color:var(--bad)}
.pill.y{background:var(--signal-wash);color:#7A5A05}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1080px){.two{grid-template-columns:1fr}}

/* ── responsive ─────────────────────────────────────── */
.railtoggle{display:none}
@media(max-width:900px){
  .rail{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease}
  body.nav-open .rail{transform:none;box-shadow:0 0 0 100vmax rgba(22,32,43,.45)}
  .railtoggle{display:inline-flex;align-items:center;gap:6px}
  .titleblock{grid-template-columns:1fr}
  .tb-grid{border-left:0;border-top:1px solid var(--rule);grid-template-columns:repeat(2,1fr)}
  .tb-title{font-size:24px}
  .sheet{padding:14px 12px 70px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent-lite);outline-offset:2px}

/* ── print ──────────────────────────────────────────── */
@media print{
  .rail,.toolbar,.btnrow,.iconbtn,.noprint{display:none!important}
  body{background:#fff}
  .app{display:block}
  .sheet{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;margin-bottom:12px}
  .titleblock{position:static;border-bottom:2px solid #000}
  input.cell,select.cell{background:none;border:0;-webkit-appearance:none;appearance:none}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr.tot td{background:#222!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:12mm}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Modules">
    <div class="brand">
      <div class="mark">DARK<span>WIZ</span> QS</div>
      <div class="sub">Quantity Surveying Suite</div>
    </div>
    <div id="nav"></div>
    <div class="railfoot">
      NSCP 2015 · DPWH · RA 9184<br>
      Data is saved in this browser only.
    </div>
  </nav>

  <div class="main">
    <header class="titleblock">
      <div class="tb-left">
        <div class="tb-crumb"><span class="chip" id="tbCode">—</span><span id="tbGroup">—</span></div>
        <h1 class="tb-title" id="tbTitle">—</h1>
        <p class="tb-note" id="tbNote"></p>
      </div>
      <div class="tb-grid">
        <div class="tb-cell"><b>Project</b><span id="tbProj">—</span></div>
        <div class="tb-cell"><b>Location</b><span id="tbLoc">—</span></div>
        <div class="tb-cell"><b>Units</b><span id="tbUnit">Metric</span></div>
        <div class="tb-cell"><b>Currency</b><span id="tbCur">PHP</span></div>
        <div class="tb-cell"><b>Prepared by</b><span id="tbPrep">—</span></div>
        <div class="tb-cell"><b>Checked by</b><span id="tbChk">—</span></div>
        <div class="tb-cell"><b>Date</b><span id="tbDate">—</span></div>
        <div class="tb-cell"><b>Rev.</b><span id="tbRev">—</span></div>
      </div>
    </header>

    <div class="toolbar noprint">
      <button class="tbtn railtoggle" onclick="document.body.classList.toggle('nav-open')">☰ Modules</button>
      <div class="tgl"><b>Units</b>
        <div class="seg" id="segUnit">
          <button data-v="metric">Metric</button><button data-v="imperial">Imperial</button>
        </div>
      </div>
      <div class="tgl"><b>Currency</b>
        <div class="seg" id="segCur">
          <button data-v="PHP">₱ PHP</button><button data-v="USD">$ USD</button>
        </div>
        <input class="tbar-fx" id="fxRate" type="number" step="0.01" title="₱ per US$1.00">
      </div>
      <div class="tbar-sp"></div>
      <button class="tbtn" onclick="App.saveFile()">Save project file</button>
      <button class="tbtn" onclick="document.getElementById('loadFile').click()">Open</button>
      <input type="file" id="loadFile" accept=".json" hidden onchange="App.loadFile(this)">
      <button class="tbtn" onclick="window.print()">Print / PDF</button>
      <button class="tbtn pri" onclick="App.exportCSV()">Export CSV</button>
    </div>

    <main class="sheet" id="sheet"></main>
  </div>
</div>
<script>
/* ══════════════════════════════════════════════════════════════
   DARKWIZ QS — single-file estimating & cost control app
   Standards basis: NSCP 2015 · DPWH Blue Book / Standard Pay Items
   · RA 9184 IRR (markup) · PD 1096 NBC
   Base units: METRIC.  Base currency: PHP.
   ══════════════════════════════════════════════════════════════ */

/* ── 1. Persistence (degrades to memory if storage is blocked) ── */
const Store = {
  _m:{},
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return this._m[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ this._m[k]=v; } }
};

/* ── 2. Unit & currency engine ─────────────────────────────── */
const UNITS = {
  metric:{ L:{f:1,u:'m'},  A:{f:1,u:'m²'},   V:{f:1,u:'m³'},
           M:{f:1,u:'kg'}, EA:{f:1,u:'ea'},  LS:{f:1,u:'l.s.'},
           BAG:{f:1,u:'bag'}, LTR:{f:1,u:'L'}, PC:{f:1,u:'pc'} },
  imperial:{ L:{f:3.280839895,u:'ft'}, A:{f:10.76391042,u:'ft²'}, V:{f:35.31466672,u:'ft³'},
           M:{f:2.204622622,u:'lb'}, EA:{f:1,u:'ea'}, LS:{f:1,u:'l.s.'},
           BAG:{f:1,u:'bag'}, LTR:{f:0.264172052,u:'gal'}, PC:{f:1,u:'pc'} }
};
const U = {
  sys(){ return S.cfg.units; },
  f(dim){ return (UNITS[S.cfg.units][dim]||{f:1}).f; },
  u(dim){ return (UNITS[S.cfg.units][dim]||{u:''}).u; },
  out(v,dim){ return (+v||0) * U.f(dim); },          // base → display
  in(v,dim){ return (+v||0) / U.f(dim); },           // display → base
  cur(){ return S.cfg.currency; },
  sym(){ return S.cfg.currency==='USD' ? '$' : '₱'; },
  fx(){ return S.cfg.currency==='USD' ? (+S.cfg.fx||58.5) : 1; },
  money(v){ return (+v||0)/U.fx(); },                // PHP base → display currency
  moneyIn(v){ return (+v||0)*U.fx(); }               // display → PHP base
};

/* ── 3. Formatters ─────────────────────────────────────────── */
const F = {
  n(v,d=2){ if(v===''||v===null||v===undefined||isNaN(v)) return '—';
    return (+v).toLocaleString('en-PH',{minimumFractionDigits:d,maximumFractionDigits:d}); },
  q(v,d=3){ return F.n(v,d); },
  m(v,d=2){ return U.sym()+' '+F.n(U.money(v),d); },       // v is PHP base
  mRaw(v,d=2){ return U.sym()+' '+F.n(v,d); },             // v already display
  pct(v,d=1){ return F.n(v,d)+'%'; },
  short(v){ const x=U.money(v); const a=Math.abs(x);
    if(a>=1e9) return U.sym()+F.n(x/1e9,2)+'B';
    if(a>=1e6) return U.sym()+F.n(x/1e6,2)+'M';
    if(a>=1e3) return U.sym()+F.n(x/1e3,1)+'K';

/* Bring a file or a stored state written by an earlier version up to date. */
function migrate(o){
  if(!o || !o.meta || !o.take) return null;
  o.ui = Object.assign({qtoBy:'item',qtoQ:'',qtoSort:'item',qtoDir:'asc',qtoSrc:'',
                        bomQ:'',bomSort:'amt',bomDir:'desc',dupaQ:'',priceQ:'',
                        newCat:null,_focus:null}, o.ui||{});
  if(!Array.isArray(o.scopes)) o.scopes = JSON.parse(JSON.stringify(DEFAULT_SCOPES));
  /* the old combined plumbing-and-electrical sheet splits in two */
  if(o.take.mep){
    const isElec = r => /^11\d\d/.test(String(r.pay||'')) || /electric|conduit|outlet|lighting|panel|wire/i.test(r.desc||'');
    o.take.plumb = (o.take.plumb||[]).concat(o.take.mep.filter(r=>!isElec(r)));
    o.take.elec  = (o.take.elec ||[]).concat(o.take.mep.filter(isElec));
    delete o.take.mep;
    o.scopes = o.scopes.filter(s=>s.id!=='mep');
  }
  DEFAULT_SCOPES.forEach((d,i)=>{ if(!o.scopes.some(s=>s.id===d.id)) o.scopes.splice(i,0,{...d}); });
  o.scopes.forEach(s=>{ if(!Array.isArray(o.take[s.id])) o.take[s.id]=[]; });
  /* pay items on the schedules, and bar grades */
  (o.rebar||[]).forEach(r=>{ if(r.pay===undefined) r.pay=''; if(!r.gr) r.gr = r.d>=16?'60':'40'; });
  (o.steel||[]).forEach(r=>{ if(!r.pay) r.pay = /purlin/i.test(r.mem)?'1047(2)c'
                                              : /sagrod|turnbuckle|brac/i.test(r.mem)?'SPL-R1':'1047(2)b'; });
  /* pay items added after the first release */
  const have=new Set((o.dupa||[]).map(d=>d.item));
  SEED_DUPA.forEach(d=>{ if(!have.has(d[0]))
    o.dupa.push({id:uid('d'),item:d[0],desc:d[1],unit:d[2],dim:d[3],lab:d[4],eqp:d[5],mat:d[6],on:true}); });
  o.bill = Object.assign({no:1,from:'',to:'',ret:10,adv:15,advOn:true,prev:{},now:{}}, o.bill||{});
  return o;
}

/* ── 6. Derived calculations ───────────────────────────────── */
const Calc = {
  rowQty(r){
    const n=+r.n||0, f=+r.f||1, l=+r.l||0, w=+r.w||0, h=+r.h||0;
    switch(r.mode){
      case 'V': return l*w*h*n*f;
      case 'A': return l*w*n*f;
      case 'L': return l*n*f;
      case 'M': return n*f;
      case 'EA':case 'LS': return n*f;
      default: return 0;
    }
  },
  rowDim(r){ return (MEAS[r.mode]||MEAS.EA).dim; },
  dupa(item){ return S.dupa.find(d=>d.item===item) || null; },
  dupaDirect(d){ return (+d.lab||0)+(+d.eqp||0)+(+d.mat||0); },
  dupaBid(d){
    const dc=Calc.dupaDirect(d);
    const om=dc*(+S.cfg.ocm||0)/100, pr=dc*(+S.cfg.profit||0)/100;
    const vt=(dc+om+pr)*(+S.cfg.vat||0)/100;
    return {dc,om,pr,vt,bid:dc+om+pr+vt};
  },
  rebarKg(r){ const w=(REBAR.find(x=>x.d==r.d)||{w:0}).w;
    return (+r.len||0)*(+r.nb||0)*(+r.n||0)*(+r.lap||1)*w; },
  rebarPay(r){ return r.pay || ((+S.meta.storeys>1)?'902(1)b':'902(1)a'); },
  steelKg(r){ return (+r.kgm||0)*(+r.len||0)*(+r.n||0)*(+r.f||1); },

  /* every measured line, before any consolidation */
  qtoLines(){
    const out=[];
    S.scopes.forEach(sc=>(S.take[sc.id]||[]).forEach(r=>{
      if(!r.pay) return;
      out.push({sheet:sc.name,sheetId:sc.id,item:r.pay,desc:r.desc,
                qty:Calc.rowQty(r),dim:Calc.rowDim(r)});
    }));
    S.rebar.forEach(r=>out.push({sheet:'Rebar schedule',sheetId:'rebar',item:Calc.rebarPay(r),
      desc:r.el+' — '+r.d+' mmØ Grade '+r.gr,qty:Calc.rebarKg(r),dim:'M'}));
    S.steel.forEach(r=>out.push({sheet:'Roof framing',sheetId:'steel',item:r.pay||'1047(2)b',
      desc:r.mem,qty:Calc.steelKg(r),dim:'M'}));
    return out;
  },
  qto(){
    const map=new Map();
    Calc.qtoLines().forEach(l=>{
      const c=map.get(l.item)||{item:l.item,qty:0,dim:l.dim,src:new Set()};
      c.qty+=l.qty; c.src.add(l.sheet); map.set(l.item,c);
    });
    return [...map.values()].sort((a,b)=>String(a.item).localeCompare(String(b.item),'en',{numeric:true}));
  },
  boq(){
    return Calc.qto().map(q=>{
      const d=Calc.dupa(q.item);
      const b=d?Calc.dupaBid(d):{dc:0,om:0,pr:0,vt:0,bid:0};
      return {...q, desc:d?d.desc:'(no DUPA — add the pay item)', unit:d?d.unit:U.u(q.dim),
              dim:d?d.dim:q.dim, ...b, amt:q.qty*b.bid, direct:q.qty*b.dc};
    });
  },
  totals(){
    const rows=Calc.boq();
    const direct=rows.reduce((a,r)=>a+r.direct,0);
    const ocm=rows.reduce((a,r)=>a+r.qty*r.om,0);
    const profit=rows.reduce((a,r)=>a+r.qty*r.pr,0);
    const vat=rows.reduce((a,r)=>a+r.qty*r.vt,0);
    const cont=direct*(+S.cfg.contingency||0)/100;
    return {rows,direct,ocm,profit,vat,cont,abc:direct+ocm+profit+vat+cont};
  },
  bom(){
    const q={}; S.scopes.forEach(sc=>(S.take[sc.id]||[]).forEach(r=>{
      if(!r.basis) return; q[r.basis]=(q[r.basis]||0)+Calc.rowQty(r); }));
    const out=new Map();
    S.coef.forEach(c=>{
      const drv=q[c.id]||0; if(!drv) return;
      c.items.forEach(([nm,coef])=>{
        const p=S.prices.find(x=>x.name===nm);
        const cur=out.get(nm)||{name:nm,unit:p?p.unit:'—',cat:p?p.cat:'Uncategorised',
                               rate:p?p.rate:0,qty:0,from:new Set()};
        cur.qty+=drv*(+coef||0); cur.from.add(c.name); out.set(nm,cur);
      });
    });
    const rk=S.rebar.reduce((a,r)=>a+Calc.rebarKg(r),0);
    if(rk){ const p=S.prices.find(x=>x.name==='Reinforcing steel (by weight)');
      out.set('Reinforcing steel (by weight)',{name:'Reinforcing steel (by weight)',unit:'kg',
        cat:p?p.cat:'Reinforcement',rate:p?p.rate:0,
        qty:(out.get('Reinforcing steel (by weight)')?.qty||0)+rk,from:new Set(['Rebar schedule'])}); }
    const sk=S.steel.reduce((a,r)=>a+Calc.steelKg(r),0);
    if(sk){ const p=S.prices.find(x=>x.name==='Structural steel (fabricated, by weight)');
      out.set('Structural steel (fabricated, by weight)',{name:'Structural steel (fabricated, by weight)',
        unit:'kg',cat:p?p.cat:'Structural steel',rate:p?p.rate:0,qty:sk,from:new Set(['Roof framing'])}); }
    return [...out.values()].map(x=>({...x,amt:x.qty*x.rate}));
  }
};

function collOf(path){ return path.startsWith('take.') ? (S.take[path.slice(5)]||[]) : (S[path]||[]); }

function inp(path,id,key,kind,extra){
  const row = collOf(path).find(x=>x.id===id) || {};
  let v = row[key];
  let cls='cell', step='', type='text';
  if(kind==='num'||kind==='money'||kind==='len'||kind==='pct'){ cls+=' n'; type='number'; step='any'; }
  if(kind==='len')   v = v===''||v==null ? '' : +(U.out(v,'L')).toFixed(4);
  if(kind==='money') v = v===''||v==null ? '' : +(U.money(v)).toFixed(2);
  if(typeof v==='number' && kind==='num') v = +(+v).toFixed(4);
  return `<input class="${cls}" type="${type}" ${step?'step="'+step+'"':''} value="${F.esc(v??'')}" ${extra||''}
    onchange="App.upd('${path}','${id}','${key}',this.value,'${kind}')">`;
}
function sel(path,id,key,opts,extra){
  const row = collOf(path).find(x=>x.id===id) || {};
  const cur = row[key];
  return `<select class="cell" ${extra||''} onchange="App.upd('${path}','${id}','${key}',this.value,'text')">`+
    opts.map(o=>{ const val=Array.isArray(o)?o[0]:o, lbl=Array.isArray(o)?o[1]:o;
      return `<option value="${F.esc(val)}" ${String(val)===String(cur)?'selected':''}>${F.esc(lbl)}</option>`;}).join('')+
    `</select>`;
}
function del(path,id){ return `<button class="iconbtn noprint" title="Delete line" onclick="App.del('${path}','${id}')">×</button>`; }
function cfgInp(key,kind,attrs){

function metaInp(key,type){

function catCell(p){
  if(S.ui.newCat===p.id)
    return `<input class="cell" id="newcat_${p.id}" placeholder="Name the new category"
      onchange="App.setCat('${p.id}',this.value)">`;
  return `<select class="cell" onchange="App.catPick('${p.id}',this.value)">`+
    categories().map(c=>`<option value="${F.esc(c)}" ${c===p.cat?'selected':''}>${F.esc(c)}</option>`).join('')+
    `<option value="__new__">＋ New category…</option></select>`;
}
function sortTh(view,key,label,cls){
  const on = S.ui[view+'Sort']===key;
  const arr = on ? (S.ui[view+'Dir']==='asc'?' ▲':' ▼') : '';
  return `<th class="${cls||''}" style="cursor:pointer;user-select:none" title="Sort by ${label}"
    onclick="App.sort('${view}','${key}')">${label}<span style="color:var(--signal)">${arr}</span></th>`;
}
function sortRows(rows,key,dir){
  const r=[...rows];
  r.sort((a,b)=>{
    const x=a[key], y=b[key];
    if(typeof x==='number' && typeof y==='number') return x-y;
    return String(x??'').localeCompare(String(y??''),'en',{numeric:true,sensitivity:'base'});
  });
  return dir==='desc'? r.reverse() : r;
}
function searchBar(view,key,ph,extra){
  return `<div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--rule)">

      style="flex:1;min-width:200px;max-width:340px;padding:6px 10px;border:1px solid var(--rule);border-radius:3px">
    ${extra||''}</div>`;
}

V.mix = () => {
  const m=S.mix, sum=(+m.cem||0)+(+m.sand||0)+(+m.grav||0);
  const vol=+m.vol||0, waste=1+(+m.waste||0)/100;
  const dry=+m.dry||1.75;
  const cemVol = sum? (m.cem/sum)*dry : 0;
  const cemKg  = cemVol*1440, bags = cemKg/40;
  const sandV  = sum? (m.sand/sum)*dry : 0;
  const gravV  = sum? (m.grav/sum)*dry : 0;
  const water  = cemKg*(+m.wc||0);
  const T = v => v*vol*waste;
  const near = MIXES.reduce((best,x)=>{
    const r=x.ratio.split(' : ').map(Number);
    const d=Math.abs(r[1]/r[0]-(m.sand/m.cem))+Math.abs(r[2]/r[0]-(m.grav/m.cem));
    return d<best.d?{d,x}:best;},{d:1e9,x:MIXES[2]}).x;
  return `
  ${kpi([
    {l:'Class match',v:near.cls,s:near.ratio+' · f\u2032c '+near.fc+' MPa'},
    {l:'Cement',v:F.n(T(bags),1),s:'bags of 40 kg, incl. '+m.waste+'% wastage',tone:'hi'},
    {l:'Sand',v:F.n(U.out(T(sandV),'V'),2),s:U.u('V')},
    {l:'Gravel',v:F.n(U.out(T(gravV),'V'),2),s:U.u('V')},
    {l:'Mixing water',v:F.n(U.out(T(water)/1000,'V')*1000,0),s:U.u('V')==='m³'?'litres':'US gal (approx.)'}
  ])}
  ${card('Mix inputs','ACI 211.1 / DPWH',`<div class="pad"><div class="fgrid">
    <div class="f"><label>Cement parts</label><input type="number" step="any" value="${m.cem}" onchange="App.mix('cem',this.value)"></div>
    <div class="f"><label>Sand parts</label><input type="number" step="any" value="${m.sand}" onchange="App.mix('sand',this.value)"></div>
    <div class="f"><label>Gravel parts</label><input type="number" step="any" value="${m.grav}" onchange="App.mix('grav',this.value)"></div>
    <div class="f"><label>Concrete volume (${U.u('V')})</label><input type="number" step="any" value="${(U.out(vol,'V')).toFixed(3)}" onchange="App.mix('vol',this.value,'V')"></div>
    <div class="f"><label>Water–cement ratio, by mass</label><input type="number" step="any" value="${m.wc}" onchange="App.mix('wc',this.value)"></div>
    <div class="f"><label>Dry volume factor</label><input type="number" step="any" value="${m.dry}" onchange="App.mix('dry',this.value)"></div>
    <div class="f"><label>Wastage %</label><input type="number" step="any" value="${m.waste}" onchange="App.mix('waste',this.value)"></div>
  </div>
  <p class="hint" style="margin-top:12px">The dry volume factor accounts for bulking and voids — 1.75 is the value that reproduces the familiar 9 bags per cubic metre for a 1:2:4 mix. Raise it toward 1.85 for well-graded aggregate and a stiffer mix.</p></div>`)}
  ${card('Quantities','Per '+U.u('V')+' and total',
   `<div class="tw"><table><thead><tr><th>Component</th><th class="n">Per ${U.u('V')}</th><th>Unit</th>
    <th class="n">For ${F.n(U.out(vol,'V'),2)} ${U.u('V')}</th><th class="n">With ${m.waste}% wastage</th><th class="n">Cost</th></tr></thead><tbody>
    ${[['Portland cement, 40 kg',bags,'bag',bags*vol,T(bags)],
       ['Washed sand',U.out(sandV,'V'),U.u('V'),U.out(sandV*vol,'V'),U.out(T(sandV),'V')],
       ['Gravel 3/4"',U.out(gravV,'V'),U.u('V'),U.out(gravV*vol,'V'),U.out(T(gravV),'V')],
       ['Water (delivered)',water,'L',water*vol,T(water)]
      ].map(r=>{
        const p=S.prices.find(x=>x.name===r[0]);
        const qty = r[0]==='Water (delivered)' ? T(water)/1000 : T(r[0]==='Portland cement, 40 kg'?bags:(r[0]==='Washed sand'?sandV:gravV));
        return `<tr><td>${r[0]}</td><td class="n num">${F.n(r[1],3)}</td><td>${r[2]}</td>
        <td class="n num">${F.n(r[3],2)}</td><td class="n num calc">${F.n(r[4],2)}</td>
        <td class="n num">${p?F.m(qty*p.rate):'—'}</td></tr>`;}).join('')}
    </tbody></table></div>`)}
  ${card('DPWH concrete classes','Reference',
   `<div class="tw"><table><thead><tr><th>Class</th><th>Proportion</th><th class="n">f\u2032c MPa</th><th class="n">psi</th>
    <th class="n">w/c</th><th class="n">Cement bags/m³</th><th class="n">Sand m³</th><th class="n">Gravel m³</th><th>Typical use</th></tr></thead><tbody>
    ${MIXES.map(x=>`<tr${x.cls===near.cls?' class="sum"':''}><td><b>${x.cls}</b></td><td class="num">${x.ratio}</td>
      <td class="n num">${x.fc}</td><td class="n num">${x.psi}</td><td class="n num">${x.wc}</td>
      <td class="n num">${F.n(x.cem,1)}</td><td class="n num">${F.n(x.sand,2)}</td><td class="n num">${F.n(x.grav,2)}</td>
      <td style="font-size:12px;color:var(--muted)">${x.use}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="pad"><p class="hint">Quantities are on the standard basis of 1.00 m³ gravel and 0.50 m³ sand per cubic metre of concrete. Cement of 1,440 kg/m³ bulk density in 40 kg bags. These are prescriptive proportions for ordinary work — anything carrying a specified f\u2032c on a signed drawing needs a trial mix and cylinder tests under NSCP 2015 Section 405.</p></div>`)}`;
};

V.takeoff = (scopeId) => {
  const sc=S.scopes.find(x=>x.id===scopeId);
  if(!sc) return '<div class="card"><div class="pad">That take-off sheet no longer exists.</div></div>';
  const path='take.'+scopeId, rows=S.take[scopeId]||[];
  let total=0, amount=0;
  const body = rows.map(r=>{
    const q=Calc.rowQty(r), dim=Calc.rowDim(r);
    const d=Calc.dupa(r.pay); const b=d?Calc.dupaBid(d):null;
    const amt=b?q*b.bid:0; total+=q; amount+=amt;
    const need=(MEAS[r.mode]||MEAS.EA).need;
    const dis = k => need.includes(k)?'':'disabled style="opacity:.3"';
    return `<tr>
      <td style="min-width:230px">${inp(path,r.id,'desc','text')}</td>
      <td style="min-width:200px">${sel(path,r.id,'pay',payOpts())}</td>
      <td style="min-width:150px">${sel(path,r.id,'mode',modeOpts())}</td>
      <td class="n" style="width:96px">${inp(path,r.id,'l','len',dis('l'))}</td>
      <td class="n" style="width:96px">${inp(path,r.id,'w','len',dis('w'))}</td>
      <td class="n" style="width:96px">${inp(path,r.id,'h','len',dis('h'))}</td>
      <td class="n" style="width:82px">${inp(path,r.id,'n','num')}</td>
      <td class="n" style="width:82px">${inp(path,r.id,'f','num')}</td>
      <td class="n num calc" style="width:110px">${F.q(U.out(q,dim))}</td>
      <td style="width:52px;color:var(--muted)">${U.u(dim)}</td>
      <td style="min-width:170px">${sel(path,r.id,'basis',coefOpts())}</td>
      <td class="n num" style="width:120px">${b?F.m(b.bid):'<span class="pill y">no rate</span>'}</td>
      <td class="n num calc" style="width:130px">${b?F.m(amt):'—'}</td>
      <td class="c">${del(path,r.id)}</td></tr>`;
  }).join('');

  const cfgStrip = `<div class="pad noprint" style="border-bottom:1px solid var(--rule-soft);background:var(--surface-2)">
    <div class="fgrid" style="grid-template-columns:2fr 1fr 3fr">
      <div class="f"><label>Sheet name</label>
        <input value="${F.esc(sc.name)}" onchange="App.scopeSet('${sc.id}','name',this.value)"></div>
      <div class="f"><label>Pay item range</label>
        <input value="${F.esc(sc.code||'')}" onchange="App.scopeSet('${sc.id}','code',this.value)"></div>
      <div class="f"><label>Sheet note</label>
        <input value="${F.esc(sc.note||'')}" onchange="App.scopeSet('${sc.id}','note',this.value)"></div>
    </div></div>`;

  return card(sc.name+' take-off', sc.code||'custom',
    `${cfgStrip}
     <div class="pad" style="padding-bottom:0"><p class="hint">Choose a measurement mode per line — the greyed dimension boxes are the ones that mode does not use. The factor column carries wastage, laps, or an allowance for a shape you have simplified. Enter a negative dimension to deduct an opening.</p></div>
     <div class="tw"><table><thead><tr>
      <th>Description</th><th>Pay item</th><th>Measurement</th>
      <th class="n">L (${U.u('L')})</th><th class="n">W (${U.u('L')})</th><th class="n">H (${U.u('L')})</th>
      <th class="n">No.</th><th class="n">Factor</th><th class="n">Quantity</th><th>Unit</th>
      <th>Material basis</th><th class="n">Unit bid price</th><th class="n">Amount</th><th></th></tr></thead>
      <tbody>${body||'<tr><td colspan="14" style="padding:22px;text-align:center;color:var(--muted)">No lines yet. Add the first one below.</td></tr>'}
      <tr class="tot"><td colspan="12">Scope amount</td><td class="n">${F.m(amount)}</td><td></td></tr>
      </tbody></table></div>`,
    `<button class="btn pri" onclick="App.addTake('${scopeId}')">Add line</button>
     <button class="btn" onclick="App.dupTake('${scopeId}')">Duplicate last line</button>
     <span class="sp" style="flex:1"></span>
     ${sc.custom?`<button class="btn" style="color:var(--bad);border-color:#E7C7C3" onclick="App.delScope('${sc.id}')">Delete this sheet</button>`
                :`<span style="align-self:center;font-size:12px;color:var(--muted)">Built-in sheet — rename it freely, but it cannot be deleted.</span>`}`);

V.rebar = () => {
  const auto=(+S.meta.storeys>1)?'902(1)b':'902(1)a';
  const payO=[['','Auto · '+auto],...payOpts().slice(1)];
  const grO=GRADES.map(g=>[g.g,'Grade '+g.g+' · f\u1d67 '+g.fy+' MPa']);
  let kg=0; const byGrade={};
  const body=S.rebar.map(r=>{
    const w=(REBAR.find(x=>x.d==r.d)||{w:0}).w, k=Calc.rebarKg(r); kg+=k;
    byGrade[r.gr]=(byGrade[r.gr]||0)+k;
    const g=GRADES.find(x=>x.g===r.gr)||GRADES[1];
    const pcs=(+r.len||0)*(+r.nb||0)*(+r.n||0)*(+r.lap||1)/12;
    return `<tr>
      <td style="min-width:200px">${inp('rebar',r.id,'el','text')}</td>
      <td style="width:100px">${sel('rebar',r.id,'d',REBAR.map(x=>[x.d,x.d+' mmØ']))}</td>
      <td style="width:150px">${sel('rebar',r.id,'gr',grO)}</td>
      <td class="n num" style="width:80px">${g.fy}</td>
      <td class="n num" style="width:82px">${F.n(w,3)}</td>
      <td class="n" style="width:100px">${inp('rebar',r.id,'len','len')}</td>
      <td class="n" style="width:92px">${inp('rebar',r.id,'nb','num')}</td>
      <td class="n" style="width:92px">${inp('rebar',r.id,'n','num')}</td>
      <td class="n" style="width:88px">${inp('rebar',r.id,'lap','num')}</td>
      <td class="n num calc" style="width:112px">${F.n(U.out(k,'M'),2)}</td>
      <td class="n num" style="width:100px">${F.n(pcs,1)}</td>
      <td style="min-width:160px">${sel('rebar',r.id,'pay',payO)}</td>
      <td class="c">${del('rebar',r.id)}</td></tr>`;
  }).join('');

     <div class="pad"><div class="note"><b>Grade 33 is not interchangeable.</b> Philippine mills still sell 10 mm and 12 mm bar as Grade 230, and it is fine for ties and slab bars in ordinary construction — but NSCP 2015 §421 bars it from members resisting earthquake forces, where the drawings will call for Grade 415. If a bar list came in without a grade, check the schedule before you price it: the difference is roughly ₱2 to ₱4 a kilo, and substituting downward is a structural defect, not a saving.</div></div>`)}`;

      <td class="n" style="width:88px">${inp('steel',r.id,'n','num')}</td>

/* ── quantity take-off summary ─────────────────────────────── */
V.qto = () => {
  const by=S.ui.qtoBy||'item', q=(S.ui.qtoQ||'').toLowerCase();
  let lines=Calc.qtoLines();
  if(S.ui.qtoSrc) lines=lines.filter(l=>l.sheetId===S.ui.qtoSrc);
  if(q) lines=lines.filter(l=>{
    const d=Calc.dupa(l.item);
    return (l.item+' '+l.desc+' '+l.sheet+' '+(d?d.desc:'')).toLowerCase().includes(q); });

  const sheets=[...new Map(Calc.qtoLines().map(l=>[l.sheetId,l.sheet])).entries()];
  const controls=`
    <select onchange="App.uiSet('qtoBy',this.value)" style="padding:6px 10px;border:1px solid var(--rule);border-radius:3px">
      ${[['item','Consolidate by pay item'],['sheet','Group by take-off sheet'],
         ['unit','Group by unit of measure'],['line','Line by line, no grouping']]
        .map(o=>`<option value="${o[0]}" ${by===o[0]?'selected':''}>${o[1]}</option>`).join('')}
    </select>
    <select onchange="App.uiSet('qtoSrc',this.value)" style="padding:6px 10px;border:1px solid var(--rule);border-radius:3px">
      <option value="">All source sheets</option>
      ${sheets.map(([id,nm])=>`<option value="${id}" ${S.ui.qtoSrc===id?'selected':''}>${F.esc(nm)}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted)">${lines.length} line${lines.length===1?'':'s'}</span>`;

  const rowsOf = ls => {
    const map=new Map();
    ls.forEach(l=>{ const c=map.get(l.item)||{item:l.item,qty:0,dim:l.dim,src:new Set(),n:0};
      c.qty+=l.qty; c.n++; c.src.add(l.sheet); map.set(l.item,c); });
    return [...map.values()].map(r=>{ const d=Calc.dupa(r.item);
      const b=d?Calc.dupaBid(d):null;
      return {...r, desc:d?d.desc:'(no DUPA)', unit:d?d.unit:U.u(r.dim),
              dimU:d?d.dim:r.dim, rate:b?b.bid:0, amt:b?r.qty*b.bid:0,
              sources:[...r.src].join(', ')}; });
  };
  const head=()=>`<tr>${sortTh('qto','item','Pay item')}${sortTh('qto','desc','Description')}
    ${sortTh('qto','qty','Quantity','n')}${sortTh('qto','unit','Unit')}
    ${sortTh('qto','rate','Unit bid price','n')}${sortTh('qto','amt','Amount','n')}
    ${sortTh('qto','sources','Source sheets')}</tr>`;
  const tr=r=>`<tr><td class="num">${F.esc(r.item)}</td><td>${F.esc(r.desc)}</td>
    <td class="n num">${F.q(U.out(r.qty,r.dimU))}</td><td>${r.unit}</td>
    <td class="n num">${r.rate?F.m(r.rate):'—'}</td><td class="n num calc">${r.amt?F.m(r.amt):'—'}</td>
    <td style="font-size:12px;color:var(--muted)">${F.esc(r.sources)}</td></tr>`;

  let table='';
  if(by==='line'){
    let ls=lines.map(l=>{ const d=Calc.dupa(l.item), b=d?Calc.dupaBid(d):null;
      return {...l, desc2:d?d.desc:'(no DUPA)', unit:d?d.unit:U.u(l.dim),
              rate:b?b.bid:0, amt:b?l.qty*b.bid:0}; });
    ls=sortRows(ls,S.ui.qtoSort==='sources'?'sheet':(S.ui.qtoSort==='desc'?'desc':S.ui.qtoSort),S.ui.qtoDir);
    const tot=ls.reduce((a,x)=>a+x.amt,0);
    table=`<table><thead><tr>${sortTh('qto','item','Pay item')}${sortTh('qto','desc','Line description')}
      ${sortTh('qto','qty','Quantity','n')}${sortTh('qto','unit','Unit')}
      ${sortTh('qto','rate','Unit bid price','n')}${sortTh('qto','amt','Amount','n')}
      ${sortTh('qto','sources','Sheet')}</tr></thead><tbody>
      ${ls.map(l=>`<tr><td class="num">${F.esc(l.item)}</td><td>${F.esc(l.desc)}</td>
        <td class="n num">${F.q(U.out(l.qty,l.dim))}</td><td>${l.unit}</td>
        <td class="n num">${l.rate?F.m(l.rate):'—'}</td><td class="n num calc">${l.amt?F.m(l.amt):'—'}</td>
        <td style="font-size:12px;color:var(--muted)">${F.esc(l.sheet)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="5">Total</td><td class="n">${F.m(tot)}</td><td></td></tr></tbody></table>`;
  } else if(by==='item'){
    const rs=sortRows(rowsOf(lines),S.ui.qtoSort,S.ui.qtoDir);
    const tot=rs.reduce((a,x)=>a+x.amt,0);
    table=`<table><thead>${head()}</thead><tbody>${rs.map(tr).join('')}
      <tr class="tot"><td colspan="5">Total</td><td class="n">${F.m(tot)}</td><td></td></tr></tbody></table>`;
  } else {
    const keyOf = l => by==='sheet' ? l.sheet : (Calc.dupa(l.item)?.unit || U.u(l.dim));
    const groups=[...new Set(lines.map(keyOf))].sort((a,b)=>String(a).localeCompare(String(b)));
    let out='', grand=0;
    groups.forEach(g=>{
      const rs=sortRows(rowsOf(lines.filter(l=>keyOf(l)===g)),S.ui.qtoSort,S.ui.qtoDir);
      const sub=rs.reduce((a,x)=>a+x.amt,0); grand+=sub;
      out+=`<tr class="grp"><td colspan="7">${F.esc(g)}</td></tr>`+rs.map(tr).join('')+
           `<tr class="sum"><td colspan="5">Sub-total — ${F.esc(g)}</td><td class="n num">${F.m(sub)}</td><td></td></tr>`;
    });
    table=`<table><thead>${head()}</thead><tbody>${out}
      <tr class="tot"><td colspan="5">Total</td><td class="n">${F.m(grand)}</td><td></td></tr></tbody></table>`;
  }
  return card('Quantity take-off summary','QTO',
    `<div class="pad" style="padding-bottom:0"><p class="hint">Read-only, and it refreshes the moment you edit any take-off sheet or schedule. Change the grouping to read the same numbers a different way, click any column heading to sort, and use the search box to isolate a trade or a keyword.</p></div>
     ${searchBar('qto','qtoQ','Search pay item, description or sheet…',controls)}
     <div class="tw">${table}</div>`);
};

      </tbody></table></div>`)}`;

    return `<tr><td class="num" style="width:96px">${F.esc(r.item)}</td>

        onchange="App.bill('prev','${r.item}',this.value)"></td>
      <td class="n" style="width:82px"><input class="cell n" type="number" step="any" value="${n}"
        onchange="App.bill('now','${r.item}',this.value)"></td>
      <td class="n num calc" style="width:78px">${F.n(td,1)}%</td>

  ${card('Statement of work accomplished','Progress billing',
   `<div class="tw"><table><thead><tr><th>Pay item</th><th>Description</th><th class="n">Contract amount</th>
     <th class="n">% previous</th><th class="n">% this period</th><th class="n">% to date</th>

/* ── 10. Controller ────────────────────────────────────────── */
const App = {
  view: 'setup',

  go(id){ App.view=id; S.ui._focus=null; App.render();
          window.scrollTo({top:0,behavior:'auto'});
          document.body.classList.remove('nav-open'); },

  render(){
    const MODS=modules();
    if(!MODS.some(m=>m.id===App.view)) App.view='setup';

    /* navigation */
    const grps=[...new Set(MODS.map(m=>m.grp))];
    document.getElementById('nav').innerHTML = grps.map(g=>
      `<div class="navgrp"><h4>${g}</h4>`+
      MODS.filter(m=>m.grp===g).map(m=>
        `<button class="navbtn ${m.id===App.view?'on':''}" onclick="App.go('${m.id}')">
           <span class="cd">${m.code}</span><span>${F.esc(m.name)}</span></button>`).join('')+
      (g==='Take-off'
        ? `<button class="navbtn" style="color:var(--signal)" onclick="App.newScope()">
             <span class="cd">＋</span><span>New take-off sheet</span></button>` : '')+
      `</div>`).join('');

    /* title block */
    const m=M(App.view)||MODS[0];
    const g=(id,v)=>document.getElementById(id).textContent=v;
    g('tbCode',m.code); g('tbGroup',m.grp); g('tbTitle',m.name); g('tbNote',m.note||'');
    g('tbProj',S.meta.name||'—'); g('tbLoc',S.meta.loc||'—');
    g('tbUnit',S.cfg.units==='metric'?'Metric (SI)':'Imperial');
    g('tbCur',S.cfg.currency==='USD'?'USD @ ₱'+F.n(S.cfg.fx,2):'PHP (₱)');
    g('tbPrep',S.meta.prep||'—'); g('tbChk',S.meta.chk||'—');
    g('tbDate',S.meta.date||'—'); g('tbRev',S.meta.rev||'—');

    /* toolbar toggles */
    document.querySelectorAll('#segUnit button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.cfg.units));
    document.querySelectorAll('#segCur button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.cfg.currency));
    const fx=document.getElementById('fxRate'); if(document.activeElement!==fx) fx.value=S.cfg.fx;

    /* body */
    let html='';
    if(m.scope) html=V.takeoff(m.scope);
    else if(V[m.id]) html=V[m.id]();
    else html='<div class="card"><div class="pad">Module not available.</div></div>';
    document.getElementById('sheet').innerHTML=html;

    /* keep the caret where the person left it while typing in a search box */
    if(S.ui._focus){
      const el=document.getElementById(S.ui._focus);
      if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
    }
    persist();
  },

  /* generic row editing */
  upd(path,id,key,val,kind){
    const row=collOf(path).find(x=>x.id===id); if(!row) return;
    if(kind==='len')        row[key]=U.in(parseFloat(val)||0,'L');
    else if(kind==='money') row[key]=U.moneyIn(parseFloat(val)||0);
    else if(kind==='num'||kind==='pct') row[key]=parseFloat(val)||0;
    else row[key]=val;
    App.render();
  },
  del(path,id){ const c=collOf(path); const i=c.findIndex(x=>x.id===id);
    if(i>-1) c.splice(i,1); App.render(); },
  add(path){
    const c=collOf(path);
    const lastCat = S.prices.length ? S.prices[S.prices.length-1].cat : 'Uncategorised';
    const T={ prices:{cat:lastCat,name:'New material',unit:'pc',dim:'PC',rate:0},
              dupa:{item:'SPL-'+String(S.dupa.length+1).padStart(2,'0'),desc:'New pay item',unit:'m²',dim:'A',lab:0,eqp:0,mat:0,on:true},
              rebar:{el:'New element',pay:'',gr:'40',d:12,len:1,nb:1,n:1,lap:1.05},
              steel:{mem:'New member',pay:'1047(2)b',kgm:3.36,len:6,n:1,f:1.05},
              cc:{el:'New cost element',bud:0,act:0,com:0},
              port:{code:'PJ-'+(2400+S.port.length+1),name:'New project',ctr:0,bld:0,cost:0,st:'Tendering'} };
    c.push({id:uid('x'),...(T[path]||{})}); App.render();
  },
  addTake(sc){ (S.take[sc]=S.take[sc]||[]).push(
      {id:uid('t'),desc:'New line',pay:'',mode:'A',l:0,w:0,h:0,n:1,f:1,basis:''}); App.render(); },
  dupTake(sc){ const a=S.take[sc]||[]; if(!a.length) return App.addTake(sc);
      a.push({...a[a.length-1],id:uid('t')}); App.render(); },
  addCoefItem(cid){
    const c=S.coef.find(x=>x.id===cid); if(!c) return;
    const nm=document.getElementById('cf_'+cid).value;
    const q=parseFloat(document.getElementById('cq_'+cid).value)||0;
    const ex=c.items.find(i=>i[0]===nm); if(ex) ex[1]=q; else c.items.push([nm,q]);
    App.render();
  },
  delCoefItem(cid,i){ const c=S.coef.find(x=>x.id===cid); if(c){ c.items.splice(i,1); App.render(); } },

  /* take-off sheets */
  newScope(){
    const n=S.scopes.filter(s=>s.custom).length+1;
    const id='cs'+Date.now().toString(36);
    S.scopes.push({id, code:'', name:'Custom take-off '+n, custom:true,
      note:'Give this sheet a name and a pay item range, then add lines the same way as any other take-off sheet.'});
    S.take[id]=[];
    App.go('tk_'+id);
  },
  scopeSet(id,key,val){ const s=S.scopes.find(x=>x.id===id); if(s){ s[key]=val; App.render(); } },
  delScope(id){
    const s=S.scopes.find(x=>x.id===id); if(!s||!s.custom) return;
    const n=(S.take[id]||[]).length;
    if(!confirm('Delete "'+s.name+'"'+(n?' and its '+n+' line'+(n>1?'s':''):'')+'? This cannot be undone.')) return;
    S.scopes=S.scopes.filter(x=>x.id!==id); delete S.take[id];
    App.go('setup');
  },

  /* price list categories */
  catPick(id,val){
    if(val==='__new__'){ S.ui.newCat=id; S.ui._focus='newcat_'+id; App.render(); return; }
    const p=S.prices.find(x=>x.id===id); if(p) p.cat=val;
    S.ui.newCat=null; App.render();
  },
  setCat(id,val){
    const p=S.prices.find(x=>x.id===id);
    const name=String(val||'').trim();
    if(p && name){
      const match=categories().find(c=>c.toLowerCase()===name.toLowerCase());
      p.cat = match || name;          /* fold an existing name back in, whatever the casing */
    }
    S.ui.newCat=null; S.ui._focus=null; App.render();
  },

  /* view state */
  uiSet(k,v){ S.ui[k]=v; S.ui._focus=null; App.render(); },
  filter(k,v,focusId){ S.ui[k]=v; S.ui._focus=focusId; App.render(); },
  sort(view,key){
    if(S.ui[view+'Sort']===key) S.ui[view+'Dir'] = S.ui[view+'Dir']==='asc'?'desc':'asc';
    else { S.ui[view+'Sort']=key; S.ui[view+'Dir']='asc'; }
    S.ui._focus=null; App.render();
  },

  /* settings */
  meta(k,v){ S.meta[k]= (k==='storeys')?(parseInt(v)||1):v; App.render(); },
  cfg(k,v){ S.cfg[k]=parseFloat(v)||0; App.render(); },
  mix(k,v,dim){ S.mix[k]= dim ? U.in(parseFloat(v)||0,dim) : (parseFloat(v)||0); App.render(); },
  units(v){ S.cfg.units=v; App.render(); },
  currency(v){ S.cfg.currency=v; App.render(); },
  billCfg(k,v){ S.bill[k]= (k==='from'||k==='to')?v : (k==='advOn'? v : (parseFloat(v)||0)); App.render(); },
  bill(which,item,v){ S.bill[which]=S.bill[which]||{}; S.bill[which][item]=parseFloat(v)||0; App.render(); },
  applyTier(){ const t=Calc.totals();
    const tier=MARKUP_TIERS.find(x=>t.direct<=x.upto)||MARKUP_TIERS[3];
    S.cfg.ocm=tier.ocm; S.cfg.profit=tier.profit; App.render(); },
  pullBudget(){
    const rows=Calc.boq(); const t=Calc.totals();
    const sum=k=>rows.reduce((a,r)=>{const d=Calc.dupa(r.item); return a+(d?r.qty*(+d[k]||0):0);},0);
    const set=(name,val)=>{ const e=S.cc.find(x=>x.el.toLowerCase().startsWith(name.toLowerCase()));
      if(e) e.bud=val; else S.cc.push({id:uid('c'),el:name,bud:val,act:0,com:0}); };
    set('Materials',sum('mat')); set('Labour',sum('lab')); set('Equipment',sum('eqp'));
    set('Site overhead',t.ocm);
    App.render();
  },
  reset(){ if(confirm('Replace everything with the sample project? Save a project file first if you need this work.')){
    S=seedState(); App.render(); } },

  /* files */
  saveFile(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(S.meta.ref||'DARKWIZ-EST')+'_'+(S.meta.date||'')+'.json';
    a.click(); URL.revokeObjectURL(a.href);
  },
  loadFile(el){
    const f=el.files&&el.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const o=migrate(JSON.parse(r.result));
        if(!o) throw new Error('not a project file');
        S=o; App.go('setup'); }
      catch(e){ alert('That file could not be read as a DARKWIZ project: '+e.message); }
      el.value=''; };
    r.readAsText(f);
  },
  exportCSV(){
    const m=M(App.view);
    const tables=[...document.querySelectorAll('#sheet table')];
    if(!tables.length){ alert('This sheet has no table to export. Try the BOQ, QTO or bill of materials.'); return; }
    const esc=s=>{ s=String(s).replace(/\s+/g,' ').replace(/[▲▼]/g,'').trim();
                   return /[",]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    let out=[[esc(S.meta.name)],[esc(S.meta.loc)],
             [esc(m.name+' — '+S.meta.ref+' rev.'+S.meta.rev+' — '+S.meta.date)],
             [esc('Units: '+(S.cfg.units==='metric'?'Metric':'Imperial')+'; Currency: '+S.cfg.currency)],[]];
    tables.forEach(t=>{
      [...t.rows].forEach(tr=>{
        out.push([...tr.cells].map(td=>{
          const f=td.querySelector('input,select');
          if(f) return esc(f.tagName==='SELECT'?(f.selectedOptions[0]?f.selectedOptions[0].text:''):f.value);
          return esc(td.textContent);
        }));
      });
      out.push([]);
    });
    const csv='\ufeff'+out.map(r=>r.join(',')).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=(S.meta.ref||'DARKWIZ')+'_'+m.id+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  }
};

/* ── 11. Boot ──────────────────────────────────────────────── */
document.querySelectorAll('#segUnit button').forEach(b=>b.onclick=()=>App.units(b.dataset.v));
document.querySelectorAll('#segCur button').forEach(b=>b.onclick=()=>App.currency(b.dataset.v));
document.getElementById('fxRate').addEventListener('change',e=>App.cfg('fx',e.target.value));
window.addEventListener('keydown',e=>{
  if(e.altKey && !e.ctrlKey && !e.metaKey){
    const MODS=modules(), i=MODS.findIndex(x=>x.id===App.view);
    if(e.key==='ArrowDown'&&i<MODS.length-1){e.preventDefault();App.go(MODS[i+1].id);}
    if(e.key==='ArrowUp'&&i>0){e.preventDefault();App.go(MODS[i-1].id);}
  }
});
App.render();

/* expose for console debugging and for inline handlers in strict embeds */
Object.assign(window,{App,Calc,F,U,modules,GRADES,REBAR,MIXES,seedState,migrate,
  __state:()=>S, __setState:o=>{S=o;}});

</script>
